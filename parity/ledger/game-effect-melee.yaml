module: packages/core/src/game/effect-melee.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/effect-handler-attack.c
    items:
      - effect_handler_TAP_UNLIFE (L1615) - the closest-undead target
        (closestTarget = the real target_set_closest(TARGET_KILL, pred) +
        target_get_monster from game/target.ts, so the drain retargets the
        player's target as upstream), the min(hp, amount) / 4 drain,
        mon_take_hit(" is destroyed!"), and the nested EF_RESTORE_MANA
        gain with its head-clearing messages.
      - effect_handler_CURSE (L1665) - direct damage to the chosen monster
        (target_get_monster, with the aimed seam as the worldless-test
        fallback), the "No monster selected!" refusal, mon_take_hit
        (" dies!"), and the fear message for shaken survivors.
      - effect_handler_JUMP_AND_BITE (L1710) - the closest living victim,
        the randint0(8)-started scan of its neighbours skipping player
        traps and webs (square_isopen: floor with no occupant), the
        not-enough-room refusal, monster_swap + player_handle_post_move
        (movePlayer + updateFov + onPlayerMoved), the min(hp + 1, amount)
        drain bitten for the full amount, the nested EF_HEAL_HP heal with
        its tier messages, and TMD_FOOD nourishment.
      - effect_handler_MOVE_ATTACK (L1785) - the four-move approach with
        the diagonal-prioritized direction pick and the d/d+1/d-1 choice
        triple over clockwise_grid, "The way is barred." (returning used
        only if any move was made), attacking a blocking monster and
        stopping, and the (blows * moves + 2) / 4 blow scaling into
        py_attack_real.
      - effect_handler_MELEE_BLOWS (L1907) - player-only, the adjacency
        and monster checks with their messages, py_attack_real per blow,
        and the PROJECT_KILL elemental side-effect projection after every
        damaging blow (via castProjection).
      - effect_handler_SWEEP (L1955) - player-only, one py_attack_real at
        each of the eight clockwise_grid neighbours per blow.
notes: >-
  Registered by registerMeleeHandlers over the core stubs. Melee routes
  through combat/melee.ts pyAttackReal with the same
  learnBrandSlayFromMelee / equipLearnOnMeleeAttack wrapping and
  onPlayerKill + deleteMonster kill path the walk command uses; effect
  damage routes through mon/take-hit.ts monTakeHit. Handlers no-op
  without a game env (worldless rule).
deferred:
  - Every formerly-deferred handler is now DONE: EF_WONDER / EF_BIZARRE
    (game-effect-attack / general), EF_COMMAND (game-mon-cmd), EF_PROBE
    (mon-lore), EF_SHAPECHANGE (game-shape) and EF_SINGLE_COMBAT
    (game-arena) - the effect_kind[] surface is fully ported.
  - target_set_closest's bookkeeping (target_set_monster, healthWho, the
    "No Available Target." / "%s is targeted." messages) is now the real
    game/target.ts implementation; the messages flow through state.msg
    (the world-event sink), not the effect context's.
  - CLOSED (2026-08-07). All four things this row deferred have landed, at
    different times and with nobody revisiting the row. message_pain including
    the message_pain_show_damage branch under OPT(player, show_damage) is
    effect-melee.ts:188-190, and the pain lines go on the mon_msg[] queue with
    the real grammar rather than the reduced flee line (PORT_TODO 3.1).
    MSG_TELEPORT is played for the JUMP_AND_BITE jump (effect-melee.ts:374,
    effect-handler-attack.c:1746, PORT_TODO 3.26). The killer name was fixed as
    PORT_TODO 3.2. The last piece was the KILL line itself, which said
    `race name + note` - "Kobold dies." - where mon-util.c:1018/1024/1050-1051
    builds it with monster_desc under MDESC_DEFAULT|MDESC_COMMA and my_strcap;
    effect-melee.ts:174 now does the same and reads "The kobold dies.".
  - EF_MOVE_ATTACK itself is ported (effect-melee.ts:374, move up to four grids
    then land the melee blows) - the handler is not the gap. What IS reduced is
    narrow and named: the pass-through grids get movePlayer + updateFov +
    onPlayerMoved without autopickup or disturb. The second half of this row is
    NOT owed at all: the early-death energy refund marked "Should return some
    energy" is left unimplemented UPSTREAM too, so matching it is parity rather
    than a defect, and core keeps upstream's warts.
verified-by:
  - game/effect-melee.test.ts (15 tests) - closestTarget targets the
    closest visible predicate match and ignores invisible monsters;
    TAP_UNLIFE drains the closest undead for the full amount and gains a
    quarter as mana, failing without an undead; CURSE damages the aimed
    monster, kills outright (rewarding onPlayerKill, deleting, saying the
    note) and refuses with no target; JUMP_AND_BITE lands the player
    adjacent, bites for the amount, heals and feeds by the drain, and
    no-ops without a living victim; MELEE_BLOWS lands blows with side
    effects on an adjacent monster and refuses far/empty targets with
    their messages; SWEEP hits every adjacent monster and nothing
    further; MOVE_ATTACK closes to adjacency on every seed and lands
    scaled blows (seed sweep), refusing a monsterless target.
