module: packages/core/src/game/cave-cmd.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/cmd-cave.c
    items:
      - do_cmd_open (L235) / do_cmd_open_test / do_cmd_open_aux: open a
        closed door (a full turn), attacking a monster in the way; locked
        doors ride the isLockedDoor / pickLock seams (door locks ARE traps
        upstream - the "door lock" trap kind - so they land with #21).
      - do_cmd_close (L395) / _test / _aux: close an open door, refuse a
        broken one, refuse with the player in the doorway, attack a
        blocking monster.
      - do_cmd_tunnel (L653) / _test / _aux / twall (L497): the digging
        attempt - square_digging class from the terrain dig rating,
        calc_digging_chances, chance > randint0(1600), wall to floor on
        success, rubble 10%-object and gold-vein treasure payouts placed
        onto the live floor piles via the object generator.
      - do_cmd_alter (L1005): monster -> attack, diggable -> tunnel,
        closed door -> open dispatch (the chest/floor-trap-disarm
        fallback branches are a REAL GAP, and reachable: "+" IS bound to alter in the shell
        key).
      - do_cmd_go_down (L101) / go_up (L56): the staircase-underfoot
        checks and the surface check before signalling a level change.
      - player_confuse_dir applied after the turn commits, as upstream.
      - do_cmd_open (L235) / do_cmd_disarm (L858) chest branches (gap
        #49): chest_check(CHEST_OPENABLE) before the door legality test
        on open; a new "disarm" action tries chest_check(CHEST_TRAPPED)
        first and merges with whatever "disarm" action trap.ts (#21)
        already registered. Both re-resolve the chest at the
        confusion-redirected grid, matching upstream. dir 5 (the
        player's own grid) is allowed for these two actions only, for a
        chest underfoot.
  - path: src/player-calcs.c
    items:
      - calc_digging_chances (L1651): the five difficulty formulas with
        the zero floor.
  - path: src/cave-square.c
    items:
      - square_isopendoor / isbrokendoor / issecretdoor / isdiggable /
        square_digging / square_tunnel_wall over the terrain flags.
notes: >-
  Doors mutate the real Chunk terrain (FEAT.OPEN / CLOSED / FLOOR), so FOV
  and monster pathing react immediately. Rubble finds and gold veins use
  makeObject / makeGold onto state.floor - the first consumer of the floor
  piles from terrain. square_isknown gates are knowledge (#24; everything
  is known). Registered by installCaveCommands; startGame wires it with the
  object generator.
deferred:
  - Locked / jammed doors and do_cmd_lock_door ARE ported and wired: the
    isLockedDoor / pickLock seams (game/cave-cmd.ts:93, :369) are supplied for
    real at session/game.ts:1716, and cmd.ts:160 records that "lock" has no
    upstream game_cmd of its own because do_cmd_lock_door is reached through
    the door-lock branch. ONE branch is owed: disarming a door lock. Upstream
    reaches it through do_cmd_disarm_aux, which walks the square's trap list for
    the first TRF_TRAP (cmd-cave.c:791-807) - a door lock IS a trap instance
    there, and the port does not yet give it that representation.
  - The swap-digger machinery (player_best_digger + the temporary
    calc_bonuses with a swapped weapon): digging reads the wielded state's
    DIGGING skill.
  - do_cmd_alter_aux's chest and floor-trap-disarm fallback branches
    (alter IS bound, to "+", at web/src/main.ts:8090).
  - SPLIT (2026-08-07): this row named five things that now have five different
    answers, and a row like that can never be closed. The five, separately:
  - do_cmd_steal is PORTED (game/steal.ts, "ported from do_cmd_steal /
    do_cmd_steal_aux") and bound to "s". Its shapechanged-player gate is NOT:
    there is no "shape" reference anywhere in steal.ts. That gate is the owed
    part, and it is the only owed part of the steal half.
  - run / explore / pathfind / navigate are PORTED (game/player-path.ts:27,
    cmd.ts:48 and :201, upkeep->steps at game/context.ts:986).
  - Command repetition is PORTED and closed as PORT_TODO 2.12, on the LIVE
    repeat path rather than a parallel one.
  - count_feats' single-target direction inference is genuinely absent - the
    "there is exactly one adjacent door, so open THAT one" shortcut.
  - "Messages are hooks" is a description of the port's design, not a deferral.
verified-by:
  - game/cave-cmd.test.ts (14 tests): the digging-chance formulas at skill
    50 and the zero floor; open/close round-trip with full-turn energy; a
    broken door refuses to close; opening nothing costs no turn; a locked
    door resists until pickLock succeeds; a monster in the doorway is
    attacked; a skilled digger turns magma to floor; an unskilled digger
    spends the turn without progress; a gold vein pays out money onto the
    floor pile; permanent rock refuses; alter dispatches to open and
    tunnel; descend/ascend require the matching staircase (and depth).
  - game/chest.test.ts: chest_check / count_chests over the 9-grid
    neighbourhood, chest_trap's destroy-before-loot ordering, chest_death's
    wooden/iron/steel counts and retry-on-null/chest, do_cmd_open_chest's
    lock pick with blind/no_light/confused penalties, do_cmd_disarm_chest's
    two-roll miss path, and both actions' dir-5 (chest underfoot) and
    chest-vs-door / chest-vs-floor-trap dispatch through installCaveCommands.
