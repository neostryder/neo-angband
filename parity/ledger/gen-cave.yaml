module: packages/core/src/gen/cave.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/gen-cave.c
    items:
      - classic_gen: size scaling, block table, the untried-block reservoir
        walk, key/rarity rolls, room_build loop, the "< 2 rooms" failure,
        perimeter perm wall, tunneling, streamers, stairs, rubble/traps,
        player placement, distant monsters, room/floor object allocation
      - modified_gen / modified_chunk: level scaling, the floor-count +
        two-room termination, the 500-attempt failure cutoff, room_build with
        find-own-space, and the same post-processing pipeline as classic
      - build_tunnel: correct_dir / rand_dir bends, wall piercing
        (pierce_outer_wall, find_normal_to_wall, handle_post_wall_step),
        marked-entrance routing (choose_random_entrance), room fast-travel,
        granite tunneling, corridor intersections, doors, preemptive
        termination
      - do_traditional_tunneling: scramble, link, next_to_corr /
        possible_doorway / try_door intersection doors
      - build_streamer (with square_upgrade_mineral treasure)
      - ensure_connectedness: build_colors / build_color_point (flood fill),
        count_colors / first_color / fix_colors, join_regions / join_region
      - handle_level_stairs (non-persistent minsep path)
  - path: src/generate.c
    items:
      - choose_profile: depth-0 town, quest -> classic, labyrinth_check,
        the depth 10-40 moria roll, and PowerWyrm's one-pass weighted
        allocation selection
moddability:
  - Cave builders live in a string-keyed registry (DungeonProfiles) and
    dungeon profiles in a runtime-registrable list; registerBuilder() and
    addProfile() are public so a mod can add a builder key and/or a whole new
    profile. loadDunProfile() converts dungeon_profile.json records (room
    names resolved to builder keys via list-rooms.h).
counts:
  live-builders: [classic, modified, town(minimal)]
  delegating-builders: [moria, labyrinth, cavern, lair, gauntlet, hard_centre]
  enabled-for-selection: [town, classic, modified]
notes: >-
  classic_gen and modified_gen reproduce the upstream RNG-consuming control
  flow for room allocation, tunneling, streamers and stair placement. Levels
  are fully connected (ensure_connectedness) before rubble/stairs are added;
  the gen.test.ts connectivity check treats rubble and doors as traversable
  (matching the pre-rubble connectivity guarantee) and confirms every
  traversable grid is reachable from the player start.
deferred:
  - "NOT DEFERRED ANY MORE, and this file said otherwise for a long time.
    Every builder this list called missing is registered and selectable:
    labyrinth_gen, cavern_gen, moria_gen, lair_gen, gauntlet_gen and
    hard_centre_gen are real builders in gen/cave.ts, and choose() runs the
    same weighted profile loop as choose_profile so any profile with alloc > 0
    is picked by depth. arena_gen is the one genuine exception and is generated
    in the session layer, as upstream also special-cases it."
  - "town_gen: NOT a minimal open level, and has not been one since the
    faithful town landed. town_gen_layout is ported whole - the lava streamers,
    the town-sized starburst, the north-wall stair search, the lot grid, all
    eight stores through build_store, lot_is_clear / lot_has_shop, build_ruin at
    80% per lot, the cleared street, and the day/night resident count. The RNG
    draw order is reproduced including Angband's MIN/MAX macro re-evaluation.
    The store-index to feature map is FeatureRegistry.shopFeats(), derived from
    the terrain data's TF_SHOP flags by finish_parse_feat (init.c L2251-2257)
    exactly as gen-cave.c L2449 reads it, and z_info->store_max is
    FeatureRegistry.storeMax. Until 2026-08-20 both were the hard-coded
    TOWN_STORE_FEATS list, which the row named as if it were the mapping: that
    made a mod's SHOP terrain a store with no door anywhere in town. The list is
    kept as the shipped-data expectation, with a test that fails if the
    derivation and the list ever part."
  - "Persistent-level handling: LIVE (PORT_TODO 4.3, 2026-08-06), not
    unexercised. build_staircase_rooms runs under dun.persist in classic,
    modified and moria; handle_level_stairs applies the persistent minsep of 4
    and skips the alloc_stairs for a direction whose neighbour already exists;
    find_joinfree_vertical_seam and transform_join_list are ported and lair_gen
    uses both, so a persistent lair splits on a column that carries no stair
    and each half is built against its own translated connector list;
    build_colors / clear_small_regions carry the per-region `stairs` map again,
    so a cavern half cannot wall up the staircase it was seeded with. labyrinth,
    gauntlet and hard_centre refuse persistent levels exactly as upstream does.
    Driven from session/changeLevel via getJoinInfo and getMinLevelSize."
  - "Neither half exists upstream. 4.2.6 has no themed levels; the only
    \"themed\" in the source is a comment describing lair_gen's themed MONSTERS
    (gen-cave.c:3526), which IS ported via setPitType + monRestrict. And
    build_streamer's whole treasure behaviour is
    `if (one_in_(chance)) square_upgrade_mineral(...)` (gen-cave.c:133),
    magma/quartz to the K variant (cave-square.c:1494) - there are no nuances
    beyond it. Reading this row is what surfaced the real bug: buildStreamer
    tested isMagma || isQuartz || isGranite where upstream tests square_isrock,
    so it overwrote existing veins and DESTROYED SECRET DOORS. Fixed."
verified-by:
  - packages/core/src/gen/gen.test.ts: profile selection by depth (town at 0,
    classic/modified below), full-level connectivity/stairs/player invariants,
    determinism, and monster/object count ranges at depths 1/5/25/50
