module: packages/core/src/game/effect-teleport.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/effect-handler-general.c
    items:
      - has_teleport_destination_prereqs (L132): hasTeleportDestinationPrereqs -
        a grid is a legal landing spot when it is passable (player) or
        monster-walkable (monster), holds no monster or player, and is not a
        shop; the player-trap / glyph-ward / damaging-terrain / web tests are
        injected predicates (inert until traps #21 and damaging terrain land).
      - effect_handler_TELEPORT (L2507): handleTELEPORT - score every interior
        grid by |distance(grid, start) - want| (want = value.base + damroll,
        adjusted by the m_bonus percentage of the largest cardinal edge distance
        and the one_in_(2) jitter), preferring non-vault grids, and move the
        player or monster to a uniformly chosen best grid; the no-teleport grid
        (short-hop exception) and no-teleport curse are honoured, the projection
        marker is cleared on the destination.
      - effect_handler_TELEPORT_TO (L2703): handleTELEPORT_TO - rejection-sample
        a legal grid near an aim (supplied coordinates, a monster, or a chosen
        target), widening the search radius as upstream (ctr > 4d^2+4d+1) when it
        keeps failing; supports the player being teleported, a monster pulled to
        the player (dis 2), the player pulled to a monster, and Dimension Door
        (the aim prompt is an injected targeting seam).
      - effect_handler_ALTER_REALITY (L1184): handleALTER_REALITY - regenerate
        the current level in place (dungeon_change_level at the same depth via the
        injected changeLevel hook); the arena-level guard is omitted.
      - effect_handler_TELEPORT_LEVEL (L2834): handleTELEPORT_LEVEL - the exact
        up/down decision tree (no rising with force_descend or in the town, no
        descending onto unleavable quest levels or past z_info->max_depth - 1,
        a coin flip when both are legal), a monster-vs-monster target simply
        deleted, a nexus-resisted hostile cast, and the level change delegated to
        the injected changeLevel hook (dungeon_change_level, #23).
  - path: src/mon-util.c
    items:
      - the project_m teleport consequence: teleportMonster is the concrete
        backing for the project_m `teleport` hook deferred in
        game/project-monster.ts (a monster teleported a fixed number of grids).
  - path: src/effects.c
    items:
      - the effect_kind[] slots for TELEPORT / TELEPORT_TO / TELEPORT_LEVEL:
        registered by registerTeleportHandlers, overriding registerCoreHandlers'
        stubs.
notes: >-
  The teleport-family general effect handlers. They mutate the live GameState
  (moving the player via movePlayer or a monster via monsterSwap, both
  game/context.ts), so they live in game/ and read their environment from
  context.env.game (the shared GameEffectEnv, effect-game-env.ts), no-opping when
  it is absent. The geometry, the RNG draw order (the jitter one_in_(2) then the
  final randint0 pick for TELEPORT; rand_loc draws for TELEPORT_TO) and the
  up/down decision are ported exactly, so a seeded run reproduces the outcome.
  The current_score seed uses the chunk's own dimensions in place of
  z_info->dungeon_wid / _hgt: it only needs to exceed any achievable score, which
  both bounds satisfy identically, so the vault-avoidance reset behaves the same.
  Everything outside this module is reached through the injected TeleportEnv
  (env.teleport), and session/game.ts wireGame supplies EVERY member of it.
  The per-field "default" in the interface describes what a worldless harness
  gets when it omits one, not what the shipped game does.

  The player slices are exported for callers that dispatch through
  effect_simple (project-player.c's GRAVITY and NEXUS handlers):
  teleportPlayer (a fixed-distance self-teleport), teleportPlayerTo (land
  near supplied coordinates via the shared findLandingNear search) and
  teleportPlayerLevel (the up/down decision, shared with
  handleTELEPORT_LEVEL).
deferred:
  - "NOT deferred any more, and the five rows this replaces were the worst kind
    of excuse: each named a blocker (#19 monster spells, #21 traps, #23 level
    change, #24 targeting) that had SHIPPED, and behind each one sat a
    TeleportEnv field with no producer anywhere in the live game. Measured
    2026-08-09 by a producer-form sweep over all production TypeScript: NINE of
    the sixteen members were never written. Every one is now supplied by
    session/game.ts wireGame, and session/teleport-env-wiring.test.ts drives the
    real handlers through the real env to keep it that way. What was actually
    broken in the shipped game, not in theory:

      hasNoTeleport / onLearnNoTeleport - the OF_NO_TELEPORT curse
        (curse.txt:326 anti-teleportation) never blocked a teleport, and its
        rune was never learned. Now playerOfHas + equipLearnFlag.
      isDamaging - square_isdamaging was undefined, so
        has_teleport_destination_prereqs accepted lava as a landing grid. Now
        state.chunk.isDamaging.
      resistsNexus - a hostile EF_TELEPORT_LEVEL was never resisted. Now the
        live derived elInfo[ELEM_NEXUS].resLevel.
      maxPlayerDepth - defaulted to the CURRENT depth, so birth_force_descend
        aimed at the level the player was standing on instead of the deepest
        reached. Now player->max_depth.
      maxDepth - hardcoded 128 rather than z_info->max_depth, which a mod may
        change. Now reg.constants.maxDepth.
      forceDescend - now the live option store (a birth option, so read, not
        captured).
      getAimTarget - Dimension Door (class.txt:396) returned false EVERY time.
        Now resolveEffectAim over the direction the shell pre-asks and rides on
        the command as args.tgtdir, which is how a port that cannot block
        mid-turn spells get_aim_dir.
      onMonsterPostMove - no handle_stuff after a monster hop. Now updateFov.

    The three player reads are getters, not values: the env is built once per
    game and shared by reference, so a captured boolean would answer for the
    character as they were at wiring time."
  - "monster_target_monster is no longer a dep at all. teleportTargetMonster
    calls game/effect-mon-origin.ts monsterTargetMonster directly, as
    effect-attack.ts, effect-general.ts and effect-terrain.ts already did;
    TeleportEnv.targetMonster survives only as an explicit override. Until then
    a monster teleporting the monster it was aiming at teleported ITSELF, and
    EF_TELEPORT_LEVEL's \"the target is simply gone\" arm was unreachable."
  - is_quest / dungeon_get_next_level / dungeon_change_level for TELEPORT_LEVEL
    are supplied (getNextLevel / changeLevel / isQuest) - the quest system (#23)
    landed and these are its real implementations.
  - The trap / glyph-ward / web destination predicates (square_isplayertrap /
    _iswarded / _iswebbed) come from trapPredicates and are supplied whenever
    the trap registry is bound, which is every real game.
  - Arena levels and decoys (cave_find_decoy / square_destroy_decoy) use their
    live GameState counterparts.
  - The SOUND is no longer deferred. MSG_TELEPORT / MSG_TPOTHER / MSG_TPLEVEL
    now go through state.sound at every site upstream calls sound()
    (PORT_TODO 3.26, closed 2026-08-05): the two swap sites in EF_TELEPORT and
    EF_TELEPORT_TO, teleportPlayer / teleportPlayerTo / teleportMonster, both
    arms of EF_TELEPORT_LEVEL and of EF_DEEP_DESCENT, EF_JUMP_AND_BITE's jump,
    and the four process_world level-change lines. The claim "sound is not
    modelled" was never true of the seam - state.sound has had seventeen other
    callers - only of this family.
  - "FIXED 2026-08-06. The monster \"puzzled\" line
    (effect-handler-general.c:2643-2650, MON_MSG_BRIEF_PUZZLE) is emitted: a
    failed teleport whose caster is a monster queues it through
    addMonsterMessage, gated on square_isseen of the caster's grid exactly as
    upstream gates it. This row is what found it - it had already worked out
    that the excuse (\"the message queue is not modelled\") had outlived the
    subsystem, and was one step short of the call."
verified-by:
  - game/effect-teleport.test.ts (15 tests): through a real EffectRegistry
    (registerCoreHandlers + registerTeleportHandlers), EF_TELEPORT moves the
    player to a distinct legal grid and fires the post-move hook, is
    deterministic for a fixed seed, is forbidden from a no-teleport grid (long
    hop) and by a no-teleport curse (learning it), no-ops worldless, and
    self-teleports a monster without moving the player; EF_TELEPORT_TO lands the
    player at a Dimension Door aim, returns false on a cancelled prompt, and is
    forbidden from a no-teleport grid; EF_TELEPORT_LEVEL sinks from the town,
    rises from the dungeon bottom, and is resisted with nexus resistance;
    chooseTeleportDestination avoids vault grids when a non-vault landing exists
    and lands near the requested distance; teleportMonster moves a monster to a
    legal grid and fires the hook.
