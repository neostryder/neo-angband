module: packages/core/src/world/
status: partial
baseline: 4.2.6
upstream:
  - path: src/cave.h
    items: [struct feature, struct square, struct chunk (core fields)]
  - path: src/init.c
    items:
      - finish_parse_feat (init.c L2248-2279) - the shopnum / store_max
        derivation and the look-prefix / look-in-preposition trailing space,
        both in world/feature.ts (FeatureRegistry). shopnum is assigned in FEAT
        order to every TF_SHOP feature (L2251-2257) and their count is
        z_info->store_max (L2275), read as shopFeats() / storeMax; the town's
        store lots and square_shopnum (cave-square.c L1512) are the only
        consumers. The trailing space landed 2026-08-20 (872006e4), the
        derivation in the same session; before it the store-index to feature
        map was a hard-coded list in gen/cave.ts.
  - path: src/cave.c
    items: [cave_new, square_set_feat (feat_count + bright glow)]
  - path: src/cave-square.c
    items:
      - feat_is_* predicates (all 19)
      - square predicates ported: isfloor, iswall, isperm, isrubble,
        isgranite/ismagma/isquartz, mineral wall, isdoor, iscloseddoor,
        isstairs/up/down, isfiery, ispassable, isprojectable, allowslos,
        iswall_inner/outer/solid, in_bounds(_fully)
  - path: src/cave-view.c
    items:
      - los (Joseph Hall integer LOS, knight-move cases)
      - update_view / update_view_one / become_viewable / update_one
      - calc_lighting / add_light / source_can_light_wall /
        glow_can_light_wall / mark_wasseen
      - motion_dir / next_grid helpers
notes: >-
  Divergences by design: flat typed arrays instead of pointer grids;
  objects/traps attach later via handles; ViewerState injects the player
  fields update_view reads; monster lights arrive as an injected source
  list instead of scanning the monster array - SUPPLIED since PORT_TODO 7.4
  by game/known.ts monsterLightSources, which is what upstream's inline
  `for (k = 1; k < cave_monster_max(c); k++)` (cave-view.c L696-719)
  becomes once the view kernel is not allowed to know what a monster is.
  It was NOT supplied for the life of this row: the type had two consumers
  and no producer, session/game.ts passed a literal `[]`, and updateView's
  own parameter defaulted to `[]` as well, so none of the 107 shipped races
  carrying a non-zero light (95 emit, 12 emit darkness) lit or darkened a
  single grid. Verified on generated levels, not in the abstract - see
  session/monster-light-wiring.test.ts. Deferred (ledgered here):
  square predicates needing objects/traps/knowledge (isempty variants,
  trap and player-knowledge predicates), square_set_feat in-game side
  effects (trap destruction, note/light spot), update_one knowledge
  effects (trap reveal, feeling display, blind memory forget), grid_data /
  map_info (render layer). Noise/scent heatmaps ported (world/flow.ts)
  from game-world.c make_noise/update_scent verbatim, including the
  row-major scent-stamp order quirk and the covert-tracks increment;
  FlowSource injects the player fields, as ViewerState does for FOV.
  scatter/scatter_ext ported (world/scatter.ts): feasible-set
  collection incl. the upstream d <= 1 distance-check skip, draw without
  replacement via rng.randint0, LOS and predicate filters.
verified-by:
  - unit tests against real pack terrain (predicates, feat counts)
  - LOS symmetry sweep over seeded random maps; knight-move cases
  - FOV behavior tests (torch radius, glowing room fully seen on entry,
    wall blocking, blindness, lit wall faces, feeling square counting)
  - session/monster-light-wiring.test.ts: calc_lighting's monster scan on a
    booted game - a lantern-bearer lights a grid nothing else lights and
    reaches its neighbours at radius ABS(light)-1; camouflaged bearers emit
    nothing; a huorn SUBTRACTS light from a lit grid. 5 mutations, 5 killed,
    including the `[]` that was the original defect.
