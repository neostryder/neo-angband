notes: >-
  This is the live-cave twin of the generation-time family in gen/util.ts
  (same upstream provenance); the barrel exports the live variants
  Live-suffixed (placeNewMonsterLive, pickAndPlaceMonsterLive,
  LiveMonPlaceDeps) to avoid colliding with the generation names. The
  session (wireGame) builds the shared MonAllocTable and threads
  trapPredicates and the mon-gen group constants in. Racial counts are now
  live: placement and populateFromLevel increment, deleteMonster and the
  level change's wipe_mon_list half (wipeMonsterCounts) decrement, and
  loadGame recounts from the restored monster list. player_kill_monster's
  dead-unique rule (max_num = 0) is wired in the session's onPlayerKill.
deferred:
  - CLOSED (2026-08-07). The monster-inventory subsystem shipped: mon.heldObj is
    a real pile filled by monsterCarry, and MonPlaceDeps carries both makeDeps
    (mon_create_drop at live placement - summons, breeders, ambient spawns,
    wizard) and mimic (mon_create_mimicked_object). session/game.ts's
    ambientPlaceDeps supplies both, so a summoned monster DOES carry loot and it
    is stamped ORIGIN_DROP_SUMMON.
  - All three have landed. mon_rating accumulates here and gen/generate.ts:392
    turns it into the level feeling; cheat_hear's OOD messages are
    mon-place.ts:415-418, reading the live option; num_repro is
    game/context.ts:428 and decremented at :1321 on a MULTIPLY breed. The
    PU_UPDATE_VIEW monster-light refresh is the ratified unconditional-repaint
    divergence (game/known.ts:153), not a deferral.
  - Killed-unique max_num zeroes SURVIVE a reload, and this row (and the
    comment at session/game.ts:989 that echoed it) said otherwise. No
    race-state save section was needed: the save already carries the lore, and
    the load path re-derives maxNum = 0 for every UNIQUE with pkills > 0
    (session/game.ts:3930-3939), which is exactly what load.c:532-535
    rd_monster_memory does. Grip does not come back.
  - RATIFIED DIVERGENCE (2026-08-07): compact_monsters exists upstream because
    cave->mon_max is a fixed allocation that can fill up. This port's monster
    list grows on demand, so there is no cap to relieve and no index to move -
    the routine has nothing to do rather than being unwritten. wipe_mon_list's
    remaining half is the session's store swap, which is how a level change
    replaces the list here.
verified-by:
  - game/mon-place.test.ts (13 tests) - squareAllowsSummon accepts empty
    floor and refuses walls/occupants/player/decoy/warded/trapped grids;
    placeNewMonsterOne registers a counted, grouped monster (deleteMonster
    uncounts), honors sleep, refuses occupied/player/wall/glyph grids,
    enforces unique cur_num/max_num and FORCE_DEPTH; placeNewMonster
