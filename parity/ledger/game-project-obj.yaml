module: packages/core/src/game/project-obj.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/project-obj.c
    items:
      - project_o (L506): the PROJECT_ITEM driver over the floor pile at a
        grid. Every per-projection object handler - the elemental
        destruction cases (ACID melts, ELEC/MANA destroy, FIRE burns,
        COLD/SOUND/SHARD/ICE/FORCE shatter, PLASMA = fire + elec, METEOR =
        fire + cold) gated by EL_INFO_HATES with EL_INFO_IGNORE resisting,
        artifacts always resisting with the "unaffected" message, the
        destruction messages with VERB_AGREEMENT, and the empty stubs for
        every other projection, exactly as upstream.
      - inven_damage (L42): the pack-side casualty roll for elemental hits.
        Equipment is exempt; artifacts skip; weapons (non-ammo) and armor
        are damaged (to_h/to_d or to_a decremented) on a single cperc roll
        instead of destroyed; rods quarter the chance; every other
        vulnerable item rolls per-copy at cperc in 10000; whole-stack /
        some-of / one-of message prefixes preserved.
notes: >-
  Wired into castProjection (game/project-cast.ts) through the optional
  CastContext.worldEnv: any projection with PROJECT.ITEM now destroys
  vulnerable floor objects, for player spells, monster spells, traps and
  device effects alike. invenDamage is exported for the project-player
  elemental side effects (the #17/#18 tail that computes cperc from damage)
  and for effect handlers that call it directly.
deferred:
  - KILL_TRAP's chest unlock is ported: obj/chest.ts supplies isLockedChest /
    unlockChest, imported at game/project-obj.ts:33 and applied in the
    PROJ.KILL_TRAP arm (:155-156), which unlocks a locked chest instead of
    destroying it.
  - CLOSED (2026-08-07). Mimics ARE in the live loop, and this file does the
    reveal: game/project-obj.ts:191-195 reads obj.mimickingMIdx and calls
    state.becomeAware on the monster behind the fake item, exactly as upstream's
    become_aware does when the object is destroyed. push_object's
    unrevealed-mimic arm landed as PORT_TODO 2.14 and delete_monster_idx cleans
    the fake item up (game/context.ts).
  - N/A while nothing projects from an object (2026-08-07). protected_obj exists
    upstream so a wand's own projection cannot destroy the wand; every projection
    this port fires originates from a player, a monster or a trap, none of which
    is an object on the floor. Recorded rather than removed: a mod adding an
    object-sourced projection would need the parameter, and the seam is one
    argument wide.
  - Three of the five are wired and two are ratified substitutions, so nothing
    is owed. Wired: ignore_item_ok (state.isIgnored, project-obj.ts:164 and
    :180), gear_to_label lettering (:291), and cmd_disable_repeat_floor_item
    (:206). Substituted: the obj->known twin is synthesised on demand
    (objectKnownShadow) rather than stored, so there is no copy to update; and
    PU_BONUS / PR_EQUIP fall under the unconditional-repaint divergence at
    game/known.ts:153.
  - CLOSED (2026-08-07). The project-player tail landed and brought them:
    game/player-side.ts calls invenDamage for the elemental branches with the
    cperc upstream computes, and game/mon-side.ts:232 supplies the same for
    monster melee. Nothing here waits on a subsystem any more.
verified-by:
  - game/project-world.test.ts: fire burns a flammable floor object while
    an EL_INFO_IGNORE object and an artifact resist; unrelated projections
    leave the pile alone; MANA destroys anything; inven_damage destroys a
    vulnerable potion stack, damages (not destroys) a weapon's to_h/to_d,
    skips items that do not hate the element, and cperc 0 is a no-op.
