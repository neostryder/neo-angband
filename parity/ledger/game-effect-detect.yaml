module: packages/core/src/game/effect-detect.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/effect-handler-general.c
    items:
      - effect_handler_MAP_AREA (L1201) - the context y/x (or value
        dice/sides) rectangle around the effect origin, the NO_MAP skip,
        memorizing interesting (non-floor) features plus adjacent walls
        for every non-wall grid, and forgetting misremembered grids. The
        exclusive upper bounds (y < y2, x < x2) are preserved.
      - effect_handler_READ_MINDS (L1286) - MAP_AREA around every
        detection-marked (MFLAG_MARK) monster, "Images form in your
        mind!".
      - effect_handler_DETECT_TRAPS (L1321) - square_reveal_trap over the
        region (through the trap system), SQUARE_DTRAP marking, and the
        always-aware messages.
      - effect_handler_DETECT_DOORS (L1398) - secret doors become real
        closed doors (place_closed_door with its one-in-four 1d7 lock
        through the trap system), doors are memorized when misremembered,
        and misremembered non-doors are forgotten.
      - effect_handler_DETECT_STAIRS (L1467) and DETECT_ORE (L1519, gold
        veins remembered, mined-out veins forgotten, silent from a none
        origin).
      - sense_stuff / detect_stuff (L1579/L1632) behind SENSE_GOLD /
        DETECT_GOLD / SENSE_OBJECTS / DETECT_OBJECTS (L1682-L1761) with
        the money / non-money predicates and inclusive bounds.
      - detect_monsters (L1768) behind DETECT_LIVING_MONSTERS /
        DETECT_VISIBLE_MONSTERS / DETECT_INVISIBLE_MONSTERS /
        DETECT_FEARFUL_MONSTERS / DETECT_EVIL / DETECT_SOUL
        (L1833-L1940) - MARK + SHOW (+ VISIBLE, the reduced update_mon)
        on every matching non-camouflaged monster in the rectangle, with
        each type's exact messages.
notes: >-
  Registered by registerDetectHandlers over the core stubs and wired in
  wireGame, so detection scrolls, staff effects, spells and rods all
  work. Handlers write the game/known.ts knowledge layer; the renderer
  displays what they reveal (detected monsters show even out of view
  until the mark fades).
deferred:
  - Chest-trap identification inside DETECT_TRAPS is PORTED (2026-08-07). The
    "scan all objects in the grid to look for traps on chests" loop
    (effect-handler-general.c:1354-1376) is at effect-detect.ts:204, including
    the "Hack - see the object" that gives an unseen chest a memory before
    writing obj->known->pval. What it waited on was the PER-OBJECT remembered
    pile, and PORT_TODO 2.9 built it: obj.knownPval IS obj->known->pval, and
    knownFloorObject(state, grid, obj) IS the `!obj->known` test. ignore_item_ok
    is also spent - obj/ignore.ts:381 supplies state.isIgnored. Still deferred
    here: the DTRAP border display, the item/monster list redraws and the
    detection sounds, which ride #25/#26.
  - Invisible-monster lore learning is PORTED (2026-08-06). detectMonsters now
    does rf_on(lore->flags, RF_INVISIBLE) for every invisible monster it marks,
    in the shared helper as upstream does - so an Evil-detection that sweeps up
    a ghost teaches invisibility too, not just DETECT_INVISIBLE. "Rides lore
    (#24)" had been spent: the lore store is game/known.ts's, and known.ts:932
    turns the same bit on when the player SEES an invisible monster, so
    detecting one taught nothing while seeing one taught everything. Still
    deferred here: the monster recall WINDOW refresh (PR_MONSTER), which is
    presentation (#25) and has no analogue in an immediate-mode renderer.
verified-by:
  - game/effect-detect.test.ts (15 tests) - MAP_AREA memorizes a door
    and nearby walls but not plain floor and forgets misremembered
    grids; READ_MINDS maps around a marked monster with its message;
    DETECT_TRAPS reveals a hidden trap, sets DTRAP and reports (also on
    an empty result); DETECT_DOORS converts a secret door to a
    remembered closed door and forgets vanished doors; DETECT_STAIRS
    and DETECT_ORE remember stairs/veins, forget mined-out veins and
    stay silent from a none origin; SENSE/DETECT_OBJECTS mark vs learn
    the pile head and DETECT_GOLD ignores non-money; the monster
    detectors mark evil/invisible monsters in range (not camouflaged /
    out-of-range / non-matching ones) with the exact messages.
