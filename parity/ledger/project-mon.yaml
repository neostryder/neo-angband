  - CLOSED (2026-08-07), and this row was RIGHT in a way its own filing hid. It
    reads as a redraw note, but project-mon.c:929-932 is an if/ELSE:

        if (player->upkeep->health_who == context->mon)
                player->upkeep->redraw |= (PR_HEALTH);
        else context->hurt_msg = MON_MSG_HEALTHIER;

    The redraw half IS a UI concern. The message half is not: upstream gives a
    TRACKED monster - the one you just hit, or your target - no "looks
    healthier" line at all. Taking the branch unconditionally printed one every
    time. MonProjectContext.healthTracked now carries health_who and the driver
    supplies it from state.healthWho. Two mutants, two kills, one on the
    handler and one on the supply.
