notes: >-
  The effect handlers reach the target through the aimed seam: obj-cmd
  useAux and spell-cmd spellCast back GameEffectEnv.aimed with a live
  getter (targetOkay(state) ? targetGet(state) : undefined), so a
  DIR_TARGET handler re-reads the target per handler exactly like
  upstream's dir == DIR_TARGET && target_okay() then target_get()
  pattern, including a target that moves or dies mid-chain.
  effect-melee's closestTarget now wraps the real targetSetClosest
  (TARGET_KILL) + targetGetMonster, so TAP_UNLIFE / JUMP_AND_BITE retarget
  the player's target as upstream; EF_CURSE prefers targetGetMonster with
  the aimed-grid fallback for worldless tests. z.maxRange joined
  GameConstants from constants.txt world:max-range.
deferred:
  - The interactive half is BUILT, in the layer this row assigned it to:
    web/src/main.ts:4103 is runTargetLoop, driven by this module's
    targetGetMonsters and targetPick, and reached from look ('l') and targeting
    ('*'). The row's tail is stale twice over - monster names in messages are
    the full monster_desc grammar (mon/desc.ts), not the race name, and the
    module header said so already.
  - panel_contains in target_sighted and restrict_to_panel in
    target_get_monsters are injected (panels are UI state; the default
    accepts everything / scans max_range as the upstream else-branch).
  - PORTED (2026-08-07). target_accept now scans the remembered pile PER OBJECT
    (target.c:347-353) and applies ignore_known_item_ok through state.isIgnored,
    so a grid holding nothing but ignored junk is no longer an interesting
    target. A `sensed` entry always accepts, because it IS upstream's
    unknown_item_kind - you cannot have chosen to ignore what you have not
    identified. Both halves it needed had landed: the per-object remembered pile
    (PORT_TODO 2.9) and obj/ignore.ts.
  - monster_race_track is a RATIFIED DIVERGENCE, not a deferral. Its whole body
    (player-calcs.c:2479-2486) is `upkeep->monster_race = race` plus
    `PR_MONSTER` - it exists to tell a monster-recall SUBWINDOW which race to
    show. This port has no subwindows: the recall is a modal the look/target
    loop opens on demand with the race under the cursor
    (web/src/main.ts:3713), so there is no tracked race to store and PR_* is
    already ratified as not-owed (game/known.ts:153). healthWho covers
    health_track, including project.c:978 and the ranged-fire sites.
  - A RATIFIED DIVERGENCE by construction, not a deferral. Upstream needs the
    retry because cmd_get_arg_target reads a target CACHED in the command
    struct, which can go stale between queueing and running. This port caches
    no direction: the shell resolves the aim at prompt time on every command
    (web/src/main.ts aimDir), and repeat is a boolean gate
    (upkeep.repeatPrevAllowed) that re-queues rather than replaying a stored
    argument - so the stale-argument case cannot arise. The target_okay() half
    of the C condition IS applied, at main.ts:4297 and :4299.
verified-by:
  - game/target.test.ts (21 tests) - target_able accepts an obvious
    projectable monster and rejects unseen / hallucinated / out-of-range
    ones; a monster target follows its monster and clears on nobody;
    location targets honor bounds; an unfixed target dies with its
    monster while a fixed target's grid survives until release (and
    release keeps a live in-view target); target_accept finds the player,
    monsters, remembered objects and remembered stairs interesting, and
    hallucination blanks all but the player; KILL-mode scans sort
    closest-first and filter; target_set_closest announces, tracks
    health, honors QUIET and reports No Available Target; target_pick
    picks by direction; target_sighted tracks SEEN grids and visible
    monsters; look_mon_desc bands and status suffixes; coords_desc.
  - game/effect-melee.test.ts (15 tests) - closestTarget now drives the
    real targetSetClosest under TAP_UNLIFE / JUMP_AND_BITE.
