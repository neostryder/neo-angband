verified-by:
  - mon/spell.test.ts (10 tests): MON_SPELL_TYPES evaluates the generated
    expressions aligned to RSF value; the breath / damage / innate predicates and
    monSpellIsValid classify correctly; RST_DAMAGE is the four damaging
    categories; test_spells / ignore_spells / create_mon_spell_mask operate on an
    RSF flagset; the hit chance is MAX(level,1)*3 + hit and drops with confusion;
    breath_dam is hp/divisor capped at the damage cap (integer division).
  - packages/content/src/data-exactness.test.ts is the ratchet for the BR_MANA
    fact above: it re-parses reference/lib/gamedata/monster.txt and diffs it
    field by field against packages/content/pack/monster.json (specs registered
    at content/src/specs/mon-init.ts:99 and :62), so a spells:BR_MANA appearing
    on the port side alone fails it today. No separate ratchet is needed or
    wanted, and none was written - there is nothing left for one to assert.
