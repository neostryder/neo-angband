module: packages/core/src/game/effect-general.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/effect-handler-general.c
    items:
      - effect_handler_GLYPH (L700) - the one-decoy-at-a-time check, the
        square_istrappable floor test with its message, push_object off the
        grid, and square_add_glyph as placeTrap of the "glyph of warding" /
        "decoy" trap kinds. The decoy grid is GameState.decoy (upstream
        cave->decoy).
      - effect_handler_WEB (L732) - the acting monster (cave->mon_current
        via GameEffectEnv.monCurrent) spins webs over every webbable grid
        (floor, no existing trap) within radius 1, +1 at spell power > 40
        and > 80; fails for a player source.
      - effect_handler_DISENCHANT (L2003) - exported as
        disenchantEquipment, shared with the PROJ_DISEN player side effect
        (project-player.c dispatches it through effect_simple). The
        rings/amulets/lights exclusion, the one_in_(count--) slot pick RNG
        order, the 60% artifact resist, and the to-hit/to-dam (weapon and
        bow) vs to-ac decrements with the >5 20% second point are
        verbatim; PU_BONUS is state.updateBonuses.
      - The stat family - RESTORE_STAT (L773), DRAIN_STAT (L803, sustain
        save with equip_learn_flag on both branches and the drain damage
        through the context's player takeHit), LOSE_RANDOM_STAT (L852,
        (randint1(STAT_MAX-1)+safe) % STAT_MAX), GAIN_STAT (L875), and
        SCRAMBLE_STATS / UNSCRAMBLE_STATS (L3634, player_scramble_stats /
        player_fix_scramble ported to player/exp.ts with the Fisher-Yates
        order and statMap bookkeeping). desc_stat reads the adjectives
        from the bound object properties (GeneralEffectEnv.properties).
      - RESTORE_EXP (L893) and GAIN_EXP (L913, amount halved), rippling
        level changes through GeneralEffectEnv.expDeps.
      - DRAIN_LIGHT (L928) - the light slot's fuel (not OF_NO_FUEL,
        timeout floored at 1) with the blind-gated message.
      - DRAIN_MANA (L956) - a decoy soaks the drain and is destroyed
        (square_destroy_decoy as squareRemoveAllTraps of the decoy kind +
        clearing GameState.decoy); no mana fails with its message; the
        drain is capped at csp (csp_frac cleared); a monster caster heals
        6 per point with the visible-monster message.
      - MON_TIMED_INC (L667) - mon_inc_timed on the casting monster.
      - PROBE (L2451) - every visible monster in line of sight reports
        its hit points ("Probing...", "That's all.") and is fully
        learned via lore_do_probe (mon/lore.ts); names are the race name
        until MDESC (#25).
      - SHAPECHANGE (L3449) - assume the subtype's shape, run its effect
        chain, learn its obvious runes and refresh bonuses (the full
        shapechange system is ledgered in game-shape.yaml).
      - COMMAND (L3479) - wake, the explicit level-vs-level save with the
        resist message, and the paired TMD_COMMAND / MON_TMD_COMMAND
        timers; the possession itself is game/mon-cmd.ts (ledgered in
        game-mon-cmd.yaml).
      - BIZARRE (L3516) - randint1(10): the malignant aura (all five
        stats and a quarter of the experience, permanently), the
        powerful-aura dispel (EF_PROJECT_LOS 1000 via the context
        registry), the 300-damage radius-3 mana ball (STOP|THRU dropped
        when aimed at an okay target) and the 250-damage mana bolt, both
        through castProjection with the upstream flag sets.
      - RECALL (L1096) - activate / cancel Word of Recall with the depth
        reset rules (recall_depth / max_depth on Player, saved), the
        randint0(20)+15 fuse, and the force_descend quest guards; the
        get_check prompts are the injected confirm (default yes). The
        countdown and the yank live in game/loop.ts processWorld
        (game-world.c L780), signalling the same targetDepth /
        generateLevel level change the stairs use.
      - DEEP_DESCENT (L1166) - the (4 / stair_skip) + 1 increment from
        max_depth, the 3+1d4 fuse, and the malevolent-presence block; the
        countdown fires the drop in processWorld (the blocked-at-bottom
        EF_DESTRUCTION fallback rides that handler).
notes: >-
  Registered by registerGeneralHandlers over the core stubs; wireGame
  attaches GeneralEffectEnv (trapDeps) through the same deps threading as
  the teleport seams (obj-cmd / spell-cmd / mon-cast / trap effect
  bundles). Handlers no-op without a game env (worldless rule) and glyph /
  web creation no-ops without the trap system.
deferred:
  - The disenchant messages are WHOLE (2026-08-06). ODESC_BASE was already
    describeObject(state, obj, ODESC.BASE); the equipment letter was the
    missing half and is now printed by both messages, resist and hit.
    gear_to_label's equipment branch (obj-gear.c:452) is one index into
    GEAR_LABELS by body slot, and disenchantEquipment already holds that
    slot - "rides the display layer (#25)" described a lookup that lives in
    game/gear.ts and that known.ts:775 was already doing.
  - obj->known->to_h/to_d/to_a display sync - knowledge is rune-based
    here (obj/knowledge.ts).
  - Monster-AI decoy targeting is PORTED. monsterIsDecoyed lives in
    game/monster-turn.ts (it needs the live cave for cave_find_decoy + los)
    and game/mon-ranged.ts:44 imports it for monster_get_target_dist_grid;
    the decoy itself is EF_GLYPH here and its death is destroyDecoy.
    mon/predicate.ts:17-19 has said so since that work landed.
  - DRAIN_MANA's monster-vs-monster branch is PORTED (2026-08-06), and it
    was a live defect rather than a missing subsystem: a monster draining
    another monster fell through to the decoy and then to the PLAYER's mana.
    monsterTargetMonster (game/effect-mon-origin.ts) was already imported
    into this file and used by MON_TIMED_INC below, so "rides monster-spell
    targeting (#19)" had been spent for some time. The branch is first of
    the three, as upstream orders them. MDESC monster names are done too -
    "appears healthier" is monsterDesc(mon, MDESC_STANDARD). Still deferred
    here: update_smart_learn(PF_NO_MANA), which rides lore (#24).
  - DRAIN_STAT's show_damage " (%d)" suffix is PORTED - the options system
    landed and ctx.env.showDamage (game/effect-env.ts:238) feeds it.
    RECALL is no longer on this list either: birth_no_recall (with its
    !total_winner exemption), birth_levels_persist, total_winner and the
    arena refusal are all live, and player_set_recall_depth (player-util.c
    L79) backs the countdown in game/loop.ts instead of the old
    recallDepth = maxDepth substitution (PORT_TODO 4.2).
verified-by:
  - game/effect-wonder.test.ts (2 BIZARRE tests) - the malignant aura
    drains all stats and a quarter of the experience permanently, and
    the mana ball blasts the targeted monster.
  - game/effect-general.test.ts (21 tests) - GLYPH places a warding glyph
    under the player; a decoy deploys once and a second is refused with
    the message; worldless no-op; WEB webs the full 3x3 at spell power 10
    and wider at 50, and fails for a player source; DISENCHANT lowers a
    worn weapon's to-hit/to-dam and refreshes bonuses, lowers armour to-ac
    with artifacts resisting, never touches rings/amulets/lights, and runs
    through the effect stack; RESTORE_STAT restores with its message;
    DRAIN_STAT drains unless sustained (learning the rune); GAIN_STAT
    raises and LOSE_RANDOM_STAT spares the safe stat; GAIN_EXP halves and
    RESTORE_EXP heals drains; DRAIN_MANA drains, heals the caster, fails
    on empty mana and is soaked by a decoy; SCRAMBLE / UNSCRAMBLE round-
    trips the stats through statMap; MON_TIMED_INC extends a monster
    condition; RECALL charges/cancels and the processWorld countdown yanks
    up from depth and down from town; DEEP_DESCENT schedules the drop and
    is blocked at the bottom.
