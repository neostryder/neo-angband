module: packages/core/src/game/trap.ts (+ packages/core/src/world/trap.ts)
status: verified
baseline: 4.2.6
upstream:
  - path: src/trap.c
    items:
      - The trap_kind table bound from trap.json (world/trap.ts bindTraps):
        appear rarity/mindepth/maxnum, the visibility power random-value,
        TRF flags, raw effect / effect-xtra chains, OF save flags, msgs;
        lookup_trap by desc (L41).
      - square_trap / _specific / _trap_flag / isplayertrap / isvisibletrap
        / iswarded / iswebbed over state.traps (grid-keyed, newest first).
      - square_remove_trap / _all_traps / _of_type (L136-L250).
      - square_player_trap_allowed (L255): one trap, no objects, TF TRAP
        terrain.
      - pick_trap (L275): cumulative-rarity pick with the min-depth,
        TRF_FLOOR and trapdoor legality rules. is_quest is no longer a
        "hook": session/game.ts supplies TrapEnv.isQuest from the player's
        quest history, so the runtime trap-creation path enforces "no trap
        doors on quest levels" as the generation path already did
        (PORT_TODO 4.2). Skipping a kind also removes its slice from the
        cumulative total, so this changes the draw, not only the outcome.
      - place_trap (L356): random pick on an illegal index, power rolled
        from the kind's random-value at trap level, instance flag copy.
      - square_reveal_trap (L399): SEARCH vs power, forced reveal, the
        VISIBLE instance flag.
      - hit_trap (L494): delayed selection, kind msg, the three save paths
        (OF save flags via the playerHasFlag hook, SAVE_ARMOR vs check_hit
        125, SAVE_THROW vs SKILL_SAVE), the effect chain run through the
        interpreter with a trap source, effect_xtra at one_in_2, TRF_DOWN
        level change, TRF_PIT pull-onto-trap, ONETIME / one_in_3 removal
        else becoming visible.
      - square_set_trap_timeout / square_trap_timeout (L625/L674).
      - square_set_door_lock / square_door_power (L706/L731): the lock IS
        the "door lock" trap; powers the cave-cmd locked-door seams.
  - path: src/cmd-cave.c
    items:
      - do_cmd_disarm / do_cmd_disarm_aux (L788): DISARM_MAGIC vs _PHYS by
        TRF_MAGICAL, the blind/no-light/confused/hallucinating tenth, power
        = depth / 5, the three-outcome roll (disarm / retry / set it off).
  - path: src/player-calcs.c
    items:
      - calc_unlocking_chance (L1676): DISARM_PHYS - 4 * lock power,
        tenth-ed by conditions, floor 2.
notes: >-
  Traps live on state.traps (the GameState seam, like floor piles); gen
  marks trap grids and rolls door locks (place_closed_door 1-in-4 at 1d7,
  now recorded instead of discarded), and startGame instantiates both on
  the live cave and installs disarm + the step-onto-trap hook
  (walkAction -> onPlayerMoved -> hit_trap, exactly move_player's flow).
  Locked doors resolve through calc_unlocking_chance in the open command.
  The web renders revealed traps under objects/monsters.
