verified-by:
  - game/trap.test.ts (14 tests): the bound pit kind's flags/power/save;
    lookup_trap; specific and random placement (none in town); reveal vs
    SEARCH and forced; a pit damages the live player through the effect
    stack; FEATHER evades; a trap door signals the level change; a
    disabled trap does not fire; door lock set/read and the non-door
    refusal; calc_unlocking_chance values; a skilled disarm removes the
    trap through processPlayer; invisible traps cannot be disarmed;
    stepping onto a trap triggers it through the walk wiring.
  - session/game.test.ts: startGame instantiates generation traps and one
    lock per generation-rolled locked door; the step hook and disarm are
    installed.
