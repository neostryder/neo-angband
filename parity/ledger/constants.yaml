module: packages/core/src/constants.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/init.h
    items: [struct angband_constants (constants.txt-sourced members)]
  - path: src/init.c
    items:
      - parse_constants_level_max / mon_gen / mon_play / dun_gen / world /
        carry_cap / store / obj_make / player (label -> field mappings)
      - melee/ranged critical scalar and level parsers (incl. o-variants)
      - finish_parse_constants / check_critical_levels (init.c L986-1020)
notes: >-
  Array-bound members upstream fills while parsing other edit files
  (store_max, k_max, a_max, r_max, ...) are derived by the respective
  registries instead of living here. store_max is FeatureRegistry.storeMax
  (finish_parse_feat's own derivation from the TF_SHOP flags). Unknown labels
  and negative scalars throw, mirroring PARSE_ERROR_UNDEFINED_DIRECTIVE /
  INVALID_VALUE. bindConstants also runs finish_parse_constants' whole-file
  check: the melee and ranged critical-level cutoffs must strictly increase or
  the pack is refused (PARSE_ERROR_NON_SEQUENTIAL_RECORDS), with the LAST row's
  cutoff exempt because nothing reads it - which is why the shipped tables end
  in -1 - and the o-variants unchecked, because upstream checks only the two
  cutoff tables. Absent until 2026-08-20; a non-increasing cutoff is silently
  unreachable in the power walk rather than an error, so a mod replacing
  melee-critical-level got a quietly wrong damage multiplier.
verified-by:
  - unit tests binding the real compiled pack (classic values pinned:
    dungeon 198x66, max depth 128, move energy 100, critical tables)
