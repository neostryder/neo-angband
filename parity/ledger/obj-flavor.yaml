    records the bug this fixed - a worn ring or amulet drew as a BLACK glyph
    where upstream draws Green / Violet / Light Blue (PORT_TODO 3.14). The
    pref-file TileMap seam above it is a SHELL override, not a missing read:
    upstream consults flavor_x_attr, and this is the answer when nothing
    supplies one.
  - NOT A DEFERRAL (2026-08-07): a cross-reference, and the file it points at is
    fully adjudicated. object_flavor_aware's propagation is
    playerKnowObjectAwareness, wired through state.flavorAwareDeps
    (game/context.ts:383, read at game/known.ts:742). flavor_init doing only the
