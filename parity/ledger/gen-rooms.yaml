module: packages/core/src/gen/room.ts
status: verified
baseline: 4.2.6
upstream:
  - path: src/gen-room.c
    items:
      - build_room_template (+ build_room_template_type, random_room_template,
        build_template): full two-pass instantiation from room_template.json,
        the symmetry transform, optional walls / random door position, the
        8/9/[ object and monster glyphs, and inner-wall conversion
      - build_vault (+ build_vault_type, random_vault, build_interesting and
        the lesser/medium/greater and "(new)" vault wrappers): full grid-text
        instantiation from vault.json, MON_RESTRICT marking, the full object
        glyph table (] armour, | weapon, =/"/!/?/_/- items, ~ chest, $ gold),
        the numeric monster/object depth glyphs, and inner-wall conversion
      - build_simple (with pillared and ragged-edge variants)
      - build_circular (with the middle-chamber variant)
      - build_overlap
      - build_crossed (all four special-feature variants)
      - build_large (all five inner-room variants)
      - build_staircase (persistent-level 1x1 staircase room)
      - find_space / check_for_unreserved_blocks / reserve_blocks /
        append_entrance
      - room_build dispatch (string-keyed via the RoomRegistry)
  - path: src/gen-chunk.c
    items:
      - symmetry_transform / get_random_symmetry_transform /
        calc_default_transpose_weight
moddability:
  - The room builder registry (RoomRegistry) is string-keyed and
    runtime-registrable; createRoomRegistry() populates it with the upstream
    builders bound to the room_template.json / vault.json data. A mod
    registers a new builder under any key and references it from a (modded)
    dungeon profile's room list. There is no closed switch. Verified by the
    gen.test.ts "mod-registered room builder" case, which registers a
    "mod_bunker" builder absent upstream and generates a full level with it.
counts:
  live-builders: [staircase, simple, circular, overlap, crossed, large,
                  template, interesting, lesser_vault, medium_vault,
                  greater_vault, lesser_new_vault, medium_new_vault,
                  greater_new_vault]
  simplified-builders: [nest, pit]
  stubbed-builders: [moria, room_of_chambers, huge]
notes: >-
  Template and vault instantiation are RNG-faithful for the structural work
  (transform draw, optional walls, door positions, feature glyphs). Verified
  by instantiating real records ("Tiny hidden room", "Round" lesser vault)
  under a fixed RNG and checking dimensions and glyph->feature mappings.
deferred:
  - CLOSED (2026-08-07). Every claim in this row is contradicted by the code it
    describes, and the row's own parenthesis half-admitted it. The inner room is
    NOT "filled with any depth-appropriate monster": gen/room.ts:1335 and :1423
    call setPitType and :1341 / :1429 prep the allocation table with
    monPitHook(pit), so the theming is the pit_profile's. Object rarity IS read
    (pit.objRarity, room.ts:1426). The concentric layout IS reproduced: the
    sixteen monster types are drawn and then bubble-sorted by level exactly as
    build_pit does (gen-room.c:2775 what[16]), which is what makes the strongest
    monsters land in the centre rings.
  - CLOSED (2026-08-07). The base-symbol restriction is there:
    gen/gen-monster.ts:466 preps the allocation table with monSelect(rng, sym,
    depth, true) - "require correct race, allow uniques" - before drawing, so an
    alphabetic racial glyph places a monster of THAT base, not any
    depth-appropriate one. The Lesser / Medium / Greater depth boost the row
    credited is right next to it (:460-463).
  - CLOSED (2026-08-07). All three are real builders, not stubs:
    gen/room.ts:1546 buildMoria, :1738 buildRoomOfChambers, :2010 buildHuge,
    registered at :2143-2145. And their profiles ARE enabled - "moria room",
    "room of chambers" and "huge room" appear in the modified, moria and lair
    cave profiles in dungeon_profile.json, and gen/cave.ts's header records that
    choose() runs the same weighted profile loop as choose_profile
    (generate.c:866-878), so any profile with alloc > 0 is picked by depth
    exactly as upstream. The row described the tree before the rooms were
    written and nobody came back to it.
  - RATIFIED DIVERGENCE (2026-08-07), and one the port cannot avoid.
    random_room_template / random_vault iterate the loaded arrays in file order;
    upstream walks a linked list built by prepending, i.e. reverse file order.
    The reservoir draw COUNT and the uniform probability are identical, so the
    RNG stream is unchanged and only WHICH template a given seed picks differs.
    "Not verified against a C run" is still true and is the honest limit of this
    entry: verifying it needs a C build to diff against, which is a
    cross-implementation exercise, not a code read.
verified-by:
  - packages/core/src/gen/gen.test.ts: room template + vault instantiation
    glyph mapping, and the mod-registered custom builder end-to-end
