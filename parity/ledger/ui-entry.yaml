notes: >-
  Front-end-agnostic DATA port of the second character screen's resist / ability
  / sustain / modifier grid. buildUiEntryConfig(packRecords) compiles
  ui_entry.txt + ui_entry_base.txt + ui_entry_renderer.txt (plus the bindui rows
  of object_property.json / player_property.json) into concrete ui_entry records
  with bound properties; characterGrid(state, config, deps) returns, per panel,
  ordered rows of {label, labelColor, cells:[{symbol,color}]} - one cell per
  equipment slot then the player. Colours are COLOUR_* indices; symbols are the
  glyph strings the shell draws. Compilation is deliverable 1
  (packages/content/src/specs/ui-entry.ts + regenerated pack JSON).
deferred:
  - Per-object known twin (obj->known) is not ported (see obj/knowledge.ts
    L22-27), so compute_ui_entry_values_for_object uses the REAL object's
    flags/modifiers/el_info gated by the player's rune knowledge (p.objKnown) as
    the object_flag_is_known / object_element_is_known stand-in - the same
    known_state deferral char-sheet.yaml / obj-desc.yaml took. An unknown rune on
    a present object still yields UI_ENTRY_UNKNOWN_VALUE; a rune-hidden value is
    not otherwise concealed.
  - The upstream separate curse-object iteration (compute L833-863) is NOT ported:
    the port's curse model differs (curse data is merged into the object's own
    flags/modifiers/el_info by obj/object.ts mergeCurses), so computeObjectValues
    reads the object's own combined properties and does not walk obj->curses.
  - UiEntryDeps seams (defaults reproduce a headless character with no active
    timed effects; a session wires the computed player_state):
    - ALL FOUR seams are SUPPLIED (PORT_TODO 3.6-3.9), by one builder:
      liveUiEntryDeps (ui-entry.ts:1472). timedObjectFlags and
      timedElementEffect come from liveTimedUiDeps over the live timed table,
      playerHas reads the COMPUTED state.playerState.pflags (the old default
      read `p.pflags`, which does not exist, so it answered false for
      everything), and launcher is equippedLauncher(p, state.runeEnv).
      Both live call sites supply it - web/charsheet.ts:284 passes it to
      characterGrid, and web/main.ts:2068 puts it in equipCmpDeps for
      equip-cmp's `opts.entryDeps` - so neither screen falls back any more.
      ONE builder is the point: wiring the timed pair and forgetting playerHas
      is exactly how this got missed the first time, and ui-entry.test.ts has
      a test named for supplying all four rather than a subset.
  - PF_FAST_SHOT (compute L974) is LIVE. It needs the equipped launcher and
    KF_SHOOTS_ARROWS, and the launcher-slot reach this row called deferred
    already existed (player/calcs.ts reads the equipped launcher's kindFlags);
    ui-entry.ts now pushes p.lev / 3 when the shooting slot fires arrows.
    (BRAVERY_30's p.lev >= 30 branch was always live.)
  - The show_combined path and the EQUIPCMP_SCREEN (equippable-comparison)
    rendering are not wired: characterGrid drives CHAR_SCREEN1 only (the char
    screen always sets show_combined = false and alternate_color_first = false,
    so no combined cell is produced - the combined value only colours the row
    label). The EQUIPCMP_SCREEN category is compiled and bound but not iterated.
  - Per-category priority overrides ARE reconstructable (PORT_TODO 3.25). The
    spec marks priority childOf category, which is parse_entry_priority's own
    last_category_index branch: with no requireParent, a priority before any
    category attaches to the record (the default) and one after a category
    attaches to that category. finish_parse honours CategoryRef.prioritySet
    rather than overwriting every category with the default. Measured: the
    shipped ui_entry.txt / ui_entry_base.txt contain ZERO priority-after-category
    lines, so this changes nothing the game shows - it is a pack-extensibility
    fix, and a test re-derives the zero from the files.
  - The DRAW half stays with the shell: the Term_putch / Term_putstr / safe_queue_
    chars row/col placement, region_erase, the value/label/combined position
    stepping (struct ui_entry_details positions), vertical labels, the equippy
    header (display_player_equippy L350) and the "abcdefgimnop@" / stat column
    headers.
verified-by:
  - game/ui-entry.test.ts (28 tests) - the nine combiners incl. RESIST_0
    (immunity trumps, resist+vuln -> RES_VUL marker) and LOGICAL_OR_WITH_CANCEL
    (negative overrides positive); generic element/stat expansion with the right
    labels (Acid/Elec/Cold/Disenchant, STR/CON) and shortened labels (Pois via
    label5, Nx via label2, Nexus/Ac filled from the full label); the undecorated
    parameterized name is not entered and templates stay template-only; bindui
    resolution (Acid gets resistance/vulnerability/immunity + 3 element abilities,
    STR gets the stat + SUST_STR aux); the priority-sorted resistance panel
    (ACID..DISEN) and abilities panel (pFear first); the renderer symbol mapping
    for COMPACT_RESIST (unknown/not-present/none/resist/vuln/immune -> ?..+-*),
    NUMERIC_AS_SIGN (.+-) and NUMERIC_WITH_BOOL_AUX (single digit / negative
    overflow / not-present) and the unknown-rune grey label; computeObjectValues
    (NULL -> NOT_PRESENT, known resist -> 1, unlearned rune -> UNKNOWN, stat + its
    sustain aux); isUiEntryForKnownRune flipping once the rune is learned; and the
    characterGrid assembly (four resist panels + the five-row stat-mod panel,
    body.count+1 cells, the " Acid:" / " Pois:" / "Nexus:" labels, empty sustain
    labels).
