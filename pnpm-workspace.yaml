packages:
  - packages/*

# Two dependencies only npm audit flags, pinned deep in devDependency trees
# (js-yaml under electron-builder, nanoid under vite/postcss) where a plain
# `pnpm update` does not reach. Both advisories require a code path this
# repository's build and test tooling does not exercise, but both patched
# versions are drop-in, so pinned rather than left at a known-vulnerable one.
overrides:
  js-yaml@<4.3.1: ">=4.3.1"
  nanoid@<3.3.18: ">=3.3.18"

# pnpm blocks a dependency's postinstall unless it is named here. pnpm 10 spelled
# this `onlyBuiltDependencies` (a list); pnpm 11 removed that in favour of
# `allowBuilds` (a map), so the old key is not deprecated - it is simply not read,
# and a silently-dropped entry here is a script that stops running with nothing
# said about it.
#
# Electron is the one that must stay true: its postinstall DOWNLOADS the Chromium
# binary, and without it `electron .` dies with "Electron failed to install
# correctly" and the desktop front end cannot start at all - which is how it sat
# until 2026-07-28. electron-builder fetches its own platform binaries the same way.
#
# esbuild is false, and that is a measurement rather than a guess: it resolves its
# executable through the platform optionalDependency (@esbuild/<plat>), so
# `require("esbuild").version` answers and both `packages/web bundle` and the
# mod-sdk plugin builder work with the postinstall skipped. Denying it is the same
# call the two mod repositories make in their package.json `allowScripts`.
# electron-winstaller is false, and it is the entry pnpm 10 never forced a look at.
# It was not in the old `onlyBuiltDependencies` list, so its build script was
# skipped SILENTLY; pnpm 11 defaults `strictDepBuilds` to true and turns that
# silence into an install error, which is how it got here. Skipping it is right:
# it builds Squirrel.Windows installers, and packages/desktop targets `nsis` and
# `portable` only - Squirrel is not in the list, and neither is the mac or linux
# equivalent. If a squirrel target is ever added, this flips to true.
allowBuilds:
  electron: true
  electron-builder: true
  electron-winstaller: false
  esbuild: false

# NOT SET, deliberately: minimumReleaseAge. pnpm 11 defaults it to 1440 minutes, so
# a package published in the last day will not resolve.
#
# It cannot stall the project's own release, which was the first worry: every internal
# dependency here is `workspace:*`, and the two mod repositories that DO consume the
# published engine install with npm, not pnpm. If that ever stops being true, prefer
# `minimumReleaseAgeExclude: ["@rpgm-tools/*"]` over turning the protection off.
#
# It is NOT merely theoretical for third-party packages, though, and this is worth
# knowing before it happens to you at an awkward moment. The pnpm 11 upgrade itself
# failed its first install: a lockfile written minutes earlier by pnpm 10 had picked
# up @napi-rs/wasm-runtime@1.2.2 (a transitive of vite 8), published eight hours
# before, and pnpm 11 refused the whole lockfile over that one entry. The fix is the
# one the error suggests - `pnpm clean --lockfile` and resolve again, which picked
# 1.2.1 from the day before - NOT an exclusion. A lockfile entry younger than the
# policy means the resolution predates the policy, and re-resolving is the honest
# repair.
