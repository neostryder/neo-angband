<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <!-- The manifest link is injected at build time by vite-plugin-pwa. -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Neo Angband</title>
    <style>
      /* Window chrome in Angband's own colours (angband_color_table in
         reference/src/z-color.c) and its 8x13 dialog font, the font and palette
         upstream's SDL2 front end draws its menus with. A mod that restyles the
         chrome sets these properties; every rule below reads them. */
      @font-face {
        font-family: "Angband 8x13";
        src: url("fonts/angband-8x13.woff2") format("woff2");
        font-display: block;
      }
      :root {
        --chrome-font: "Angband 8x13", "Cascadia Mono", Consolas, monospace;
        --chrome-font-size: 13px;
        --chrome-page: #000000; /* COLOUR_DARK */
        --chrome-title-bg: #000000; /* COLOUR_DARK, SDLPUI_COLOR_MENU_BG */
        --chrome-text: #c0c0c0; /* COLOUR_L_WHITE */
        --chrome-text-strong: #ffffff; /* COLOUR_WHITE, SDLPUI_COLOR_MENU_FG */
        --chrome-muted: #808080; /* COLOUR_SLATE */
        --chrome-border: #282828; /* COLOUR_SHADE, SDLPUI_COLOR_MENU_BORDER */
        --chrome-gutter: #282828; /* COLOUR_SHADE */
        --chrome-gutter-hover: #606060; /* COLOUR_L_DARK */
        --chrome-accent: #ffff00; /* COLOUR_YELLOW, the subwindow cursor */
        --chrome-accent-rgb: 255, 255, 0;
        --chrome-float-border: #606060; /* COLOUR_L_DARK */
        --chrome-radius: 0px;
        --chrome-shadow: none;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--chrome-page);
        overflow: hidden;
      }
      #game-layout {
        position: fixed;
        inset: 0;
        background: var(--chrome-page);
      }
      #game-view,
      .tile-leaf {
        position: absolute;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
      }
      #game-view {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .tile-leaf[hidden] {
        display: none;
      }
      .tile-title {
        height: 20px;
        padding: 0 4px 0 6px;
        box-sizing: border-box;
        background: var(--chrome-title-bg);
        color: var(--chrome-text);
        font: var(--chrome-font-size)/20px var(--chrome-font);
        user-select: none;
        border-bottom: 1px solid var(--chrome-border);
        display: flex;
        align-items: center;
      }
      .tile-drag-handle {
        flex: none;
        width: 8px;
        margin-right: 6px;
        color: var(--chrome-muted);
        font: var(--chrome-font-size)/20px var(--chrome-font);
        text-align: center;
        user-select: none;
      }
      .tile-title-label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile-close {
        flex: none;
        width: 16px;
        height: 16px;
        margin-left: 4px;
        border: none;
        background: transparent;
        color: var(--chrome-muted);
        font: var(--chrome-font-size)/16px var(--chrome-font);
        cursor: pointer;
        padding: 0;
      }
      .tile-close:hover {
        color: var(--chrome-text-strong);
      }
      .tile-float-action,
      .tile-dock-action {
        border: 0;
        background: transparent;
        color: var(--chrome-muted);
        font: var(--chrome-font-size)/16px var(--chrome-font);
        cursor: pointer;
        padding: 0 3px;
      }
      .tile-float-action:hover,
      .tile-dock-action:hover {
        color: var(--chrome-text-strong);
      }
      .tile-float-action[hidden],
      .tile-dock-action[hidden] {
        display: none;
      }
      .tile-floating {
        box-shadow: var(--chrome-shadow);
        border: 1px solid var(--chrome-float-border);
        border-radius: var(--chrome-radius);
        box-sizing: border-box;
      }
      .tile-floating .tile-title {
        cursor: move;
        touch-action: none;
      }
      .tile-float-resize {
        display: none;
      }
      .tile-floating .tile-float-resize {
        display: block;
        position: absolute;
        right: 0;
        bottom: 0;
        width: 12px;
        height: 12px;
        cursor: nwse-resize;
        touch-action: none;
        background: linear-gradient(135deg, transparent 50%, var(--chrome-muted) 50%);
      }
      .tile-controls {
        flex: none;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .tile-control {
        flex: none;
        width: 16px;
        height: 16px;
        border: none;
        background: transparent;
        color: var(--chrome-muted);
        font: var(--chrome-font-size)/16px var(--chrome-font);
        cursor: pointer;
        padding: 0;
      }
      .tile-control:hover {
        color: var(--chrome-text-strong);
      }
      .tile-select {
        max-width: 140px;
        height: 18px;
        border: 1px solid var(--chrome-border);
        border-radius: var(--chrome-radius);
        background: var(--chrome-title-bg);
        color: var(--chrome-text);
        font: var(--chrome-font-size) var(--chrome-font);
        padding: 0;
      }
      .tile-body {
        position: absolute;
        inset: 20px 0 0 0;
      }
      .tile-body > * {
        filter: var(--tile-content-filter, none);
      }
      .tile-body canvas,
      .subwindow-slot canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      /* A mod pane hides its terminal canvas, and the display rule above would
         otherwise keep it in the flow at the pane's full height. */
      .tile-body canvas[hidden] {
        display: none;
      }
      .tile-panel-placeholder {
        padding: 6px 8px;
        color: var(--chrome-text);
        font: var(--chrome-font-size)/16px var(--chrome-font);
      }
      .tile-panel-placeholder p {
        margin: 0 0 8px;
      }
      .tile-panel-placeholder button {
        border: 1px solid var(--chrome-float-border);
        border-radius: var(--chrome-radius);
        background: var(--chrome-title-bg);
        color: var(--chrome-text-strong);
        font: var(--chrome-font-size)/16px var(--chrome-font);
        padding: 1px 8px;
        cursor: pointer;
      }
      .tile-panel-placeholder button:hover {
        border-color: var(--chrome-accent);
      }
      .tile-gutter {
        position: absolute;
        z-index: 3;
        background: var(--chrome-gutter);
        touch-action: none;
      }
      .tile-gutter:hover,
      .tile-gutter:active {
        background: var(--chrome-gutter-hover);
      }
      .tile-drop-preview {
        position: absolute;
        z-index: 1001;
        pointer-events: none;
        background: rgba(var(--chrome-accent-rgb), 0.22);
        outline: 1px solid var(--chrome-accent);
      }
      .tile-drop-guide {
        position: absolute;
        z-index: 1000;
        pointer-events: none;
      }
      .tile-drop-guide[data-kind="dock"] {
        background: rgba(var(--chrome-accent-rgb), 0.1);
        outline: 1px solid rgba(var(--chrome-accent-rgb), 0.45);
        outline-offset: -1px;
      }
      .tile-drop-guide[data-kind="swap"],
      .tile-drop-guide[data-kind="tab"] {
        background: transparent;
        outline: 1px dashed rgba(var(--chrome-accent-rgb), 0.35);
        outline-offset: -1px;
      }
      .tile-drop-guide[data-kind="swap"],
      .tile-drop-guide[data-kind="tab"],
      .tile-drop-preview {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--chrome-accent);
        font: var(--chrome-font-size) var(--chrome-font);
        overflow: hidden;
      }
      .tile-tabs {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: stretch;
        gap: 2px;
        overflow: hidden;
        height: 19px;
      }
      .tile-tabs[hidden] {
        display: none;
      }
      .tile-tab {
        flex: 0 1 auto;
        min-width: 32px;
        max-width: 160px;
        padding: 0 6px;
        border: none;
        border-bottom: 1px solid transparent;
        background: transparent;
        color: var(--chrome-muted);
        font: var(--chrome-font-size)/18px var(--chrome-font);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .tile-tab:hover {
        color: var(--chrome-text-strong);
      }
      .tile-tab[aria-selected="true"] {
        color: var(--chrome-text-strong);
        border-bottom-color: var(--chrome-accent);
      }
      .tile-main-grip {
        position: absolute;
        top: 2px;
        right: 2px;
        z-index: 2;
        width: 18px;
        height: 18px;
        padding: 0;
        border: 1px solid var(--chrome-border);
        border-radius: var(--chrome-radius);
        background: var(--chrome-title-bg);
        color: var(--chrome-muted);
        font: var(--chrome-font-size)/16px var(--chrome-font);
        cursor: grab;
        opacity: 0.55;
      }
      .tile-main-grip:hover {
        opacity: 1;
        color: var(--chrome-text-strong);
      }
      .tile-main-grip[hidden] {
        display: none;
      }
      .tile-gutter-locked,
      .tile-gutter-locked:hover {
        background: var(--chrome-gutter);
        pointer-events: none;
      }
      .chrome-notice {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1100;
        max-width: min(640px, calc(100% - 32px));
        box-sizing: border-box;
        padding: 4px 10px;
        border: 1px solid var(--chrome-float-border);
        border-radius: var(--chrome-radius);
        background: var(--chrome-title-bg);
        color: var(--chrome-text);
        font: var(--chrome-font-size)/17px var(--chrome-font);
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.6s ease-out;
      }
      .chrome-notice[hidden] {
        display: none;
      }
      .chrome-notice-fading {
        opacity: 0;
      }
      .panel-pin {
        position: absolute;
        top: 8px;
        /* Clear of the dungeon view's move grip in the corner. */
        right: 28px;
        z-index: 1100;
        min-width: 28px;
        height: 28px;
        padding: 0 8px;
        border: 1px solid var(--chrome-float-border);
        border-radius: var(--chrome-radius);
        background: var(--chrome-title-bg);
        color: var(--chrome-text);
        font: 18px/26px var(--chrome-font);
        cursor: pointer;
      }
      .panel-pin:hover,
      .panel-pin:focus-visible {
        border-color: var(--chrome-text);
      }
      .panel-pin[hidden] {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        .chrome-notice {
          transition: none;
        }
      }
      .tile-host-dragging,
      .tile-host-dragging * {
        cursor: grabbing !important;
      }
    </style>
  </head>
  <body>
    <div id="game-layout">
      <main id="game-view">
        <canvas id="game"></canvas>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
