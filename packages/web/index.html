<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101014" />
    <!-- The manifest link is injected at build time by vite-plugin-pwa. -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Neo Angband</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #101014;
        overflow: hidden;
      }
      #game-layout {
        position: fixed;
        inset: 0;
        background: #101014;
      }
      #game-view,
      .tile-leaf {
        position: absolute;
        overflow: hidden;
        min-width: 0;
        min-height: 0;
      }
      #game-view {
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .tile-leaf[hidden] {
        display: none;
      }
      .tile-title {
        height: 20px;
        padding: 0 4px 0 8px;
        box-sizing: border-box;
        background: #18181e;
        color: #c0c0c8;
        font: 12px/20px sans-serif;
        user-select: none;
        border-bottom: 1px solid #50505a;
        display: flex;
        align-items: center;
      }
      .tile-drag-handle {
        flex: none;
        width: 12px;
        margin-right: 4px;
        color: #50505a;
        font: 11px/20px sans-serif;
        text-align: center;
        user-select: none;
      }
      .tile-title-label {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile-close {
        flex: none;
        width: 16px;
        height: 16px;
        margin-left: 4px;
        border: none;
        background: transparent;
        color: #70707a;
        font: 13px/16px sans-serif;
        cursor: pointer;
        padding: 0;
      }
      .tile-close:hover {
        color: #e0e0e6;
      }
      .tile-controls {
        flex: none;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .tile-control {
        flex: none;
        width: 16px;
        height: 16px;
        border: none;
        background: transparent;
        color: #70707a;
        font: 12px/16px sans-serif;
        cursor: pointer;
        padding: 0;
      }
      .tile-control:hover {
        color: #e0e0e6;
      }
      .tile-body {
        position: absolute;
        inset: 20px 0 0 0;
      }
      .tile-body canvas,
      .subwindow-slot canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      .tile-gutter {
        position: absolute;
        z-index: 3;
        background: #2a2a32;
        touch-action: none;
      }
      .tile-gutter:hover,
      .tile-gutter:active {
        background: #6a6a78;
      }
      .tile-drop-preview {
        position: absolute;
        z-index: 4;
        pointer-events: none;
        background: rgba(201, 162, 39, 0.28);
        outline: 1px solid #c9a227;
      }
      .tile-drop-guide {
        position: absolute;
        z-index: 3;
        pointer-events: none;
      }
      .tile-drop-guide[data-kind="dock"] {
        background: rgba(201, 162, 39, 0.14);
        outline: 1px solid rgba(201, 162, 39, 0.45);
        outline-offset: -1px;
      }
      .tile-drop-guide[data-kind="swap"] {
        background: transparent;
        outline: 1px dashed rgba(201, 162, 39, 0.35);
        outline-offset: -1px;
      }
      .tile-host-dragging,
      .tile-host-dragging * {
        cursor: grabbing !important;
      }
    </style>
  </head>
  <body>
    <div id="game-layout">
      <main id="game-view">
        <canvas id="game"></canvas>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
