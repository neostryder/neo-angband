<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101014" />
    <!-- The manifest link is injected at build time by vite-plugin-pwa. -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Neo Angband</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #101014;
        overflow: hidden;
      }
      #game-layout {
        position: fixed;
        inset: 0;
        display: flex;
      }
      #game-view {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
      #subwindows {
        flex: 0 0 clamp(280px, 32vw, 520px);
        min-width: 0;
        display: grid;
        grid-template-rows: minmax(0, 2fr) minmax(0, 1fr);
        border-left: 1px solid #50505a;
        background: #101014;
      }
      #subwindows[data-count="1"] {
        grid-template-rows: minmax(0, 1fr);
      }
      #subwindows[hidden],
      .subwindow-slot[hidden] {
        display: none;
      }
      .subwindow-slot {
        position: relative;
        min-height: 0;
        overflow: hidden;
      }
      .subwindow-slot + .subwindow-slot {
        border-top: 1px solid #50505a;
      }
      .subwindow-slot canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <div id="game-layout">
      <main id="game-view">
        <canvas id="game"></canvas>
      </main>
      <aside id="subwindows" aria-label="Subwindows" hidden>
        <section id="subwindow-monsters-slot" class="subwindow-slot" aria-label="Visible monsters" hidden>
          <canvas id="subwindow-monsters"></canvas>
        </section>
        <section id="subwindow-messages-slot" class="subwindow-slot" aria-label="Message history" hidden>
          <canvas id="subwindow-messages"></canvas>
        </section>
      </aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
