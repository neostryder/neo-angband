name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "reference/**"
  pull_request:
    paths-ignore:
      - "reference/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # pnpm-workspace.yaml allowlists Electron's postinstall so a DEVELOPER gets
      # the Chromium binary (without it `electron .` cannot start at all). CI only
      # type-checks, lints and tests the desktop front end - it never launches it -
      # so skip the ~110 MB download here rather than pay it on every run.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      # Catch Vite/PWA build breaks on PRs, not just at deploy time.
      - run: pnpm --dir packages/web bundle
      # The plugin builder moved to packages/mod-sdk (it ships as the
      # neo-angband-mod-build bin, so a mod repository can build itself), and its
      # guarantees are proven against fixtures in packages/mod-sdk/src/mod-build.test.ts
      # under `pnpm test` below - including the failure paths, which the old step over
      # two correct mods could not exercise. So there is no separate build step here any
      # more; each mod repository runs the builder over its own source in its own CI.
      # `pnpm test` runs everything, packages/borg included. It did not always:
      # foundation.test.ts and think.test.ts hung indefinitely (no output, no
      # timeout - a synchronous spin the test timeout cannot interrupt), so both
      # were excluded and the Borg's decision ladder had never once been executed
      # by a test. The cause was core's Rng: the Borg reseeded per think through
      # setState(), which is the savefile path and forces quick mode OFF, leaving
      # an all-zero WELL table - a fixed point that emits zero to every draw. The
      # fix is Rng.reseed(); the exclusions came off with it.
      - run: pnpm test
      # Redundant with `pnpm test` and kept deliberately: this is the command a
      # borg change is run under locally, and it must stay a command that works.
      - run: pnpm test:borg
      # Parity harness (packages/cli): the parity.test.ts guard runs inside
      # `pnpm test` above; this runs the golden scenarios as a standalone Node
      # program too, so a break in the runnable harness (loader, entry wiring)
      # surfaces in CI even if the vitest path stays green.
      - run: pnpm --filter @rpgm-tools/neo-angband-cli scenarios
      # The published-package check: packs every publishable package (the list is
      # DERIVED by tools/publishable.mjs from `private`, not written down), extracts
      # each into an empty directory and imports every entry point with plain Node.
      # This is the step that would have caught 4612 extensionless import
      # specifiers, which every test here missed because vitest resolves through
      # Vite. See docs/RELEASING.md.
      #
      # It runs on npm@latest, the same npm publish-npm.yml installs, and NOT on the
      # npm the runner happens to bundle. That is not tidiness: `npm pack --json`
      # returns an array on npm 11 and an object keyed by package name on npm 12, and
      # because this step ran on Node 24's bundled 11.x while only the release path
      # ever saw 12, the checker was broken for every package with a green CI to
      # prove otherwise. A tool whose whole job is to find out what npm actually does
      # has to run on the npm that will do it.
      - run: npm install -g npm@latest
      - run: pnpm check:npm
      # The MCP server, spawned and spoken to. Its 25 tests drive the tools
      # directly with no transport, so nothing else here would notice a break in
      # the stdio wiring - and a client's only symptom is a disconnect.
      - run: node packages/mcp/tools/smoke.mjs
