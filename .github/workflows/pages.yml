name: Deploy web build to GitHub Pages

# Pages is enabled in workflow build mode. Deploys run on every push to
# master and can also be triggered by hand.
on:
  push:
    branches: [master]
    paths-ignore:
      - "reference/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # This job builds the WEB bundle; it never launches the desktop shell, so
      # skip Electron's ~110 MB binary download (see the same note in ci.yml).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir packages/web bundle
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist-web
      - id: deployment
        uses: actions/deploy-pages@v5
