name: Deploy web build to GitHub Pages

# Pages is enabled in workflow build mode. Deploys run when a release is
# PUBLISHED, not on every push to master - so the browser build is always a
# version somebody pressed Publish on, the same gate docs/RELEASING.md
# already describes for the updater and for the Discord announcement.
#
# The `early` channel (edge.yml) publishes a release too, once per commit on
# master, so its tags are excluded below the same way discord-announce.yml
# excludes them - otherwise this would redeploy Pages on every push, which is
# the exact behaviour this change is undoing.
#
# `workflow_dispatch` takes an explicit tag rather than defaulting to
# whatever is on master, so a manual re-run cannot accidentally publish an
# unreleased commit.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and deploy (e.g. v0.31.0)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# TWO JOBS, AND THE SPLIT IS THE POINT.
#
# This used to be one job: install, build, bundle, upload the `github-pages`
# artifact, deploy. That works until a deploy fails on GitHub's side, and on
# 2026-08-06 one did - every build step green, then `actions/deploy-pages` sat
# at `Current status: deployment_queued` for eleven minutes and hit its own
# timeout. Nothing was wrong with the repository, so the remedy was a re-run.
#
# `gh run rerun <id> --failed` then failed DIFFERENTLY, and worse:
#
#   Found 2 artifact(s)
#   Error: Multiple artifacts named "github-pages" were unexpectedly found for
#   this workflow run. Artifact count is 2.
#
# With one job there is no "just the deploy step" to retry - the re-run repeats
# the upload, the first attempt's artifact is still attached to the run, and
# deploy-pages refuses to choose between them. A transient stall became an
# unrecoverable run, and the only way out was a fresh workflow_dispatch.
#
# Split as below - which is also the shape actions/deploy-pages documents - a
# re-run of the failed job re-runs `deploy` ALONE. It uploads nothing, so there
# is nothing to collide with, and a stalled deployment costs one click.
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || !contains(github.event.release.tag_name, '-edge.')
    env:
      # This job builds the WEB bundle; it never launches the desktop shell, so
      # skip Electron's ~110 MB binary download (see the same note in ci.yml).
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # Explicit ref, not the default `github.sha` a `release` event provides
      # (that resolves to the default branch, not the tag). This must build
      # exactly the tagged commit - anything else quietly reintroduces master
      # tracking under a different trigger.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir packages/web bundle
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
