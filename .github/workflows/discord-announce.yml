# Post a Discord forum announcement when a real version is published.
#
# `release.yml` publishes the release itself (see the note there), and that
# publish is done by GITHUB_TOKEN - which means the `release: published` event
# it produces does NOT cascade to this workflow, by GitHub's own documented
# anti-recursion rule (workflow_dispatch and repository_dispatch are the only
# events exempted from it). So `release.yml`'s publish job dispatches this
# workflow directly once the release exists, and the `release` trigger below
# is kept only for a manual publish through the GitHub UI (recovering from the
# rare mid-build-failure draft state described in docs/RELEASING.md).
#
# The `early` channel (edge.yml) publishes a release too, once per commit on
# master, so its tags are excluded below the same way release.yml excludes
# them from being built as a numbered release in the first place - otherwise
# this would post to Discord on every push. `release.yml` never dispatches
# this workflow for an edge tag either, since it never runs its publish job
# for one.
#
# Every real release is announced regardless of version-bump size - patch,
# minor and major all post; see .github/scripts/discord-announce.mjs.
name: Discord release announcement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing published tag to announce (e.g. v0.34.2)"
        required: true
        type: string

jobs:
  announce:
    if: ${{ !contains(github.event.inputs.tag || github.event.release.tag_name, '-edge.') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/discord-announce.mjs
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
