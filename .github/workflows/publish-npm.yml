# Publish the library packages to npm.
#
# THIS IS THE ANSWER TO "who remembers to push updates". npm does not watch a
# GitHub repository - a publish is a push, and a package sits at whatever version
# was last pushed to the registry no matter what master says. So the push is
# automated off a tag: `git tag v0.10.0 && git push --tags` publishes, and nothing
# else does.
#
# NO TOKEN. This authenticates by TRUSTED PUBLISHING (OIDC): npm is told, once per
# package, that this repository's `publish-npm.yml` may publish it, and the CLI
# proves it is that workflow with a short-lived identity token minted by GitHub.
# There is no secret in this repository, so there is none to leak, rotate, or find
# expired at the worst moment. It replaces the granular access token this file used
# to describe: npm's 2026-07-08 changelog stops 2FA-bypass tokens from bypassing
# 2FA for account changes in early August 2026, and stops them publishing at all in
# January 2027.
#
# THE FIRST PUBLISH OF EACH PACKAGE IS MANUAL. A trusted publisher is configured on
# a package's settings page, and a package that has never been published has no
# settings page. So version one goes up from a laptop with a 2FA prompt, the
# publisher is configured, and every release after that is a tag. The publish step
# below detects the not-yet-published case and says so rather than failing with an
# authentication error that names nothing. docs/RELEASING.md is the runbook.
#
# Two safety properties, because a publish cannot be taken back (npm unpublish is
# blocked after 72 hours, and a version number can never be reused even then):
#
#   - the tag must AGREE with each package.json version, or the job fails before
#     publishing anything;
#   - a version already on the registry is SKIPPED, not retried, so re-running a
#     job that half-published finishes the rest instead of dying on the first one.
#
# Provenance comes free with trusted publishing: npm records, cryptographically,
# which workflow in which repository at which commit built the tarball.
name: publish-npm

on:
  push:
    # NOT the `early` channel's tags. edge.yml tags every commit on master
    # (v0.16.1-edge.42) so the updater has a version to compare; publishing each
    # of those to npm would put a package per commit on the registry under a
    # version nobody chose, and npm versions cannot be reused after unpublishing.
    tags: ["v*", "!v*-edge.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and check, publish nothing"
        type: boolean
        default: true

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole authentication story. Without it there is no identity token to
      # mint, and npm falls back to looking for a token that does not exist.
      id-token: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No cache on the release path deliberately. It runs a handful of times a
          # year, and a release build that reuses nothing is one less thing to have
          # to reason about when a tarball looks wrong.
          #
          # setup-node has cached AUTOMATICALLY since v5 whenever package.json names
          # a package manager. v6 narrowed that to npm only, and ours says pnpm, so
          # today the automatic path does not fire here - but "the default does not
          # apply to us" is not the same as "we said no", and the line above says no
          # out loud. Turn it off out loud too.
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1. Node 24 bundles 11.16.0 as of
      # v24.18.1, which clears that bar, and this step installs npm@latest (12.x)
      # on top anyway - but a floor that is satisfied by accident is still worth
      # asserting, because an old npm does not error: it silently looks for a token
      # and fails with ENEEDAUTH, which reads like a permissions problem and is not
      # one. `pnpm check:npm` in ci.yml installs the same npm@latest, so the tarball
      # check runs against the npm that publishes rather than whatever the runner
      # happened to ship - which is how the npm 12 `pack --json` shape change sat
      # undetected until someone ran the checker locally.
      - name: npm must be new enough to authenticate by OIDC
        run: |
          npm install -g npm@latest
          have=$(npm --version)
          echo "npm $have"
          node -e '
            const [have, need] = [process.argv[1], "11.5.1"];
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number), pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) if (pa[i] !== pb[i]) return pa[i] - pb[i];
              return 0;
            };
            if (cmp(have, need) < 0) {
              console.error(`::error::npm ${have} cannot use trusted publishing; ${need} or newer is required`);
              process.exit(1);
            }
          ' "$have"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The tarball is what gets published, so the tarball is what gets checked:
      # packs each package, extracts it into an empty directory and imports it
      # with plain Node. This is the step that would have caught the engine's
      # 4612 extensionless import specifiers, which every in-repo test missed
      # because vitest resolves them through Vite.
      - run: node tools/check-npm-package.mjs

      - name: The tag must match the package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fail=0
          # The package list is DERIVED from the manifests (tools/publishable.mjs):
          # a package is publishable exactly when npm would publish it, i.e. when
          # it does not carry `private: true`. This loop used to say
          # `for pkg in core mod-sdk`, one of four hardcoded copies of that list -
          # and the failure mode of a stale copy HERE is silence, since a package
          # the loop never names is simply never checked and never published.
          for pkg in $(node tools/publishable.mjs); do
            have=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$have" != "$tag" ]; then
              echo "::error::tag $GITHUB_REF_NAME says $tag but packages/$pkg is $have"
              fail=1
            fi
          done
          exit $fail

      - name: Publish
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          # `npm publish -w` is not available: the workspace is declared in
          # pnpm-workspace.yaml, which npm does not read. Publishing from inside
          # each package directory works under either manager, and these packages
          # have zero dependencies so there is no workspace: range to rewrite.
          #
          # Derived, not listed - see the note on the version check above.
          for pkg in $(node tools/publishable.mjs); do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")

            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on the registry; skipping"
              continue
            fi

            if [ "$DRY_RUN" = "true" ]; then
              echo "dry run: would publish $name@$version"
              (cd "packages/$pkg" && npm publish --dry-run --access public)
              continue
            fi

            # A package with NO versions at all has no settings page, so it can
            # have no trusted publisher, so this job cannot be the thing that
            # publishes it first. Say that, instead of letting npm answer with an
            # authentication error for a configuration that was never made.
            if ! npm view "$name" version >/dev/null 2>&1; then
              echo "::error::$name has never been published, so it has no trusted-publisher setting yet."
              echo "::error::Publish $version once by hand (docs/RELEASING.md), configure this workflow as its trusted publisher, then re-run."
              exit 1
            fi

            echo "publishing $name@$version"
            (cd "packages/$pkg" && npm publish --access public)
          done
