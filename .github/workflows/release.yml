# Build the game people actually download, and attach it to the tag.
#
# THE GAP THIS CLOSES. Before this file, a tag published three npm packages and
# nothing else: there were zero GitHub Releases across all five repositories,
# no job built the desktop app, and `dist:portable` made a 112 MB executable on
# one laptop that nothing ever uploaded. The only documented way to play was
# `git clone && pnpm install`, which is a developer preview, not a public alpha.
#
# WHAT A TAG NOW PRODUCES:
#
#   Windows   installer (.exe), portable (.exe), zip
#   macOS     .dmg and .zip, for Apple silicon and Intel
#   Linux     AppImage, .deb, tar.gz
#   Any       neo-angband-web-<version>.zip - the static site, for self-hosting
#
# NOTHING HERE IS SIGNED, and that is stated on the Release page rather than
# left for a player to discover from an OS warning. Signing needs a paid Apple
# Developer identity and a Windows certificate; until those exist, an honest
# "here is what your OS will say and here is why" beats a silent scary dialog.
#
# The release is created as a DRAFT when the build finishes. Publishing it is a
# human decision - the artifacts are downloadable from the draft, so the last
# gate before a release goes public is somebody actually running one.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.15.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.label }}
    strategy:
      # One platform failing must not cancel the other two: a Linux packaging
      # break should still leave the Windows and macOS builds attached to the
      # draft, because partial artifacts are worth more than none.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder looks for a signing identity in the keychain and, not
      # finding one on a runner, has historically emitted a warning that reads
      # like a failure. Say no explicitly.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # NOT skipping the Electron binary download here, unlike ci.yml and
      # pages.yml: this is the one job that genuinely needs Chromium, because
      # it is the job that packages it.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # `dist:ci` builds the web bundle first (the desktop app IS the web app in
      # a window), then runs electron-builder for this runner's platform. It is
      # a separate script rather than `dist -- --publish never` because the dist
      # scripts are a `&&` chain and where a forwarded argument lands in a chain
      # is not something to leave to the package manager. `--publish never`
      # keeps electron-builder away from the Releases API: this workflow decides
      # what is uploaded and when, in one place, in the job below.
      - run: pnpm --filter @rpgm-tools/neo-angband-desktop dist:ci

      # Everything a player downloads, and nothing else. electron-builder also
      # writes builder-effective-config.yaml, .blockmap sidecars and the
      # auto-update latest*.yml; none of those belong on a Release page for a
      # project with no auto-updater.
      - uses: actions/upload-artifact@v5
        with:
          name: desktop-${{ matrix.label }}
          if-no-files-found: error
          path: |
            packages/desktop/dist-desktop/*.exe
            packages/desktop/dist-desktop/*.dmg
            packages/desktop/dist-desktop/*.zip
            packages/desktop/dist-desktop/*.AppImage
            packages/desktop/dist-desktop/*.deb
            packages/desktop/dist-desktop/*.tar.gz

  web:
    name: Static site
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --dir packages/web bundle
      # The same folder Pages serves, as one file. Someone self-hosting should
      # not have to clone a repository and install a toolchain to get a
      # directory of static files.
      - name: Zip the static site
        run: |
          version="${{ github.event.inputs.tag || github.ref_name }}"
          version="${version#v}"
          (cd packages/web/dist-web && zip -qr "../../../neo-angband-web-${version}.zip" .)
      - uses: actions/upload-artifact@v5
        with:
          name: web-site
          if-no-files-found: error
          path: neo-angband-web-*.zip

  publish:
    name: Draft the release
    needs: [desktop, web]
    # `always()` so a single platform failing still produces a draft holding the
    # platforms that worked - see fail-fast above. The draft says which ones.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Compose the release notes
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          {
            printf '## What you can download\n\n'
            printf '| Platform | File |\n| --- | --- |\n'
            printf '| Windows (installer) | `Neo Angband Setup %s.exe` |\n' "$version"
            printf '| Windows (portable, one file) | `Neo Angband-%s-portable.exe` |\n' "$version"
            printf '| macOS | `.dmg`, or the `.zip` if you prefer to unpack it yourself |\n'
            printf '| Linux | `.AppImage` (no install), `.deb`, or `.tar.gz` |\n'
            printf '| Self-hosting | `neo-angband-web-%s.zip` - static files, any web server |\n' "$version"
            printf '\nThe **portable** Windows build and the **AppImage** need no installer:\n'
            printf 'download, run, and the game keeps its saves in a folder beside itself.\n'
            printf '\n### These builds are not code-signed\n\n'
            printf 'There is no Apple Developer identity or Windows certificate behind this\n'
            printf 'project yet, so Windows SmartScreen will say "unrecognised app" and macOS\n'
            printf 'will say the developer cannot be verified. On Windows choose *More info ->\n'
            printf 'Run anyway*; on macOS right-click the app and choose *Open*. If that trade\n'
            printf 'is not one you want to make, build it yourself - `docs/INSTALL.md` - or play\n'
            printf 'in the browser, which needs no trust decision at all.\n\n'
            printf '### Your save\n\n'
            printf 'Saves survive an update. Every save-format change ships the conversion that\n'
            printf 'reads the version before it, and a save this build cannot open is left\n'
            printf 'untouched rather than replaced.\n\n'
            printf -- '---\n\n'
            node tools/changelog-section.mjs "$version"
            printf '\n\n---\n\n'
            printf 'Found something that does not match Angband 4.2.6? '
            printf '[Open an issue](https://github.com/neostryder/neo-angband/issues/new/choose) '
            printf 'or come and say so in [the Discord](https://discord.gg/YegtwbHTBQ).\n'
          } > release-notes.md
          cat release-notes.md

      - name: Draft it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no artifacts were produced; not drafting a release"
            exit 1
          fi
          echo "attaching ${#files[@]} files"
          # A re-run must not fail on "already exists": update the draft in place.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --notes-file release-notes.md
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --draft \
              --title "Neo Angband ${TAG#v}" \
              --notes-file release-notes.md
          fi
          echo "::notice::Draft release $TAG is ready. Download one, play it, then publish."
