name: Something is broken
description: A crash, a stuck screen, a save that will not load, a wrong number
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For anything that is plainly wrong rather than merely different from the
        original. If your question is "does the real Angband do this too?", the
        [parity form](?template=1-parity-difference.yml) is the better fit -
        but do not agonise over the choice, it can be moved.

        **If a character will not load, do not delete anything.** The game
        leaves an unreadable save exactly where it is; a copy of it, exported
        from the character select, is often the fastest route to a fix.

  - type: textarea
    id: what
    attributes:
      label: What happened
      placeholder: >-
        The screen went black after I took the stairs down and no key did
        anything.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to get there
      description: >-
        Even "I don't know, it happened once" is worth filing. Write down what
        you were doing right before it.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The number on the title screen.
      placeholder: "0.14.0"
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where you were playing
      options:
        - Desktop app (Windows)
        - Desktop app (macOS)
        - Desktop app (Linux)
        - Browser
        - Installed as a PWA
        - Built from source (dev server)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version, if you were in one
      placeholder: Firefox 148

  - type: input
    id: mods
    attributes:
      label: Mods enabled
      description: Press `=` in game to see them, or say "none".
      placeholder: none
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Anything in the developer console
      description: >-
        Optional, and genuinely useful for a crash. In the browser or the
        desktop app, press F12 and copy anything in red from the Console tab.
      render: text
