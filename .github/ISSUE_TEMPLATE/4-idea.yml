name: An idea
description: A quality-of-life change, a mod idea, or something the port could do better
title: "[idea] "
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome. One thing to know before you write, because it saves
        disappointment: **the core game is a port, and improvements to Angband
        do not go in it.** Where faithfulness and a better idea disagree,
        faithfulness wins in core - and the better idea ships as a mod you turn
        on. That is not a brush-off; it is the whole architecture, and it is why
        `qol` and `bug-fixes` exist.

        So the useful question is usually not "should this happen" but "which
        side of that line is it on".

  - type: dropdown
    id: kind
    attributes:
      label: Which side do you think it is on
      description: A guess is fine - it is often a good discussion in itself.
      options:
        - A mod - it changes how the game plays
        - Core - the original does this and the port does not
        - Core - it is about the port itself (display, keys, saves, performance)
        - The mod system, the SDK, or the tools
        - No idea
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: The idea
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What made you want it
      description: >-
        The moment in play that prompted this is more persuasive than the
        feature description, and it often points at a simpler fix than the one
        you had in mind.
